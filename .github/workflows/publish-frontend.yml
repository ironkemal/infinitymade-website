name: Build and Publish frontend (Caddy + Oberfläche) image

on:
  push:
    branches: [main]
    paths:
      # ⚠️ Diese Liste muss deckungsgleich mit der COPY-Liste in
      # onprem/frontend.Dockerfile sein — sonst baut ein geänderter Screen
      # kein neues Image (O-57, onprem-Review 12.09.2026). Bei jeder Änderung
      # der COPY-Liste dort: hier in derselben Reihenfolge nachziehen.
      - 'login.html'
      - 'login.js'
      - 'dashboard.html'
      - 'dashboard.css'
      - 'dashboard.js'
      - 'kalender.html'
      - 'kalender.js'
      - 'employee-signup.html'
      - 'employee-signup.js'
      - 'confirm.html'
      - 'attendance.html'
      - 'attendance.js'
      - 'setup.html'
      - 'setup.js'
      - 'booking.html'
      - 'booking.js'
      - 'booking-request.html'
      - 'booking-request.css'
      - 'booking-request.js'
      - 'nav-registry.js'
      - 'katalog-suche.js'
      - 'patient-suche.js'
      - 'calendar-widget.js'
      - 'arzt-suche.js'
      - 'icd-dg-match.js'
      - 'sentry-init.js'
      - 'supabase-config.js'
      - 'assets/system.css'
      - 'manifest.json'
      - 'module/**'
      - 'vendor/**'
      - 'fonts/**'
      - 'assets/img/foot/**'
      - 'favicon.svg'
      - 'favicon.png'
      - 'apple-touch-icon.png'
      - 'logo.png'
      - 'onprem/Caddyfile'
      - 'onprem/frontend.Dockerfile'
      - '.github/workflows/publish-frontend.yml'
      # O-25/R5 (12.09.2026): api- ve frontend-Image tek bir Produktversion
      # paylaşır (VERSION, Repo-Root). Bkz. publish-calendar-api.yml aynı satır.
      - 'VERSION'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # R4: yayın koşusunda git tag push'lanıyor — contents: write şart.
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O-25/R3-R6: Release-Erkennung ve PATCH/MAJOR kapıları tam tag
          # geçmişi ister.
          fetch-depth: 0

      # ── Sürüm bilgisi — publish-calendar-api.yml'deki adımın birebir aynısı.
      # İkisi paralel tetiklenir (R5), ikisi de aynı VERSION'ı okur.
      - name: Sürüm bilgisi
        id: version
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "→ v$VERSION zaten basılmış — bu bir yayın koşusu değil, yalnız :beta + sha"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "→ v$VERSION henüz yok — bu bir YAYIN koşusu, X.Y.Z de basılacak"
          fi

          ONCEKI="$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
          echo "onceki=$ONCEKI" >> "$GITHUB_OUTPUT"
          echo "→ önceki yayın: ${ONCEKI:-<yok — ilk yayın>}"

      # R6, api-backend/db/migrations'a bakar — frontend-only bir yayında bile
      # bu kontrol koşar, çünkü PATCH kuralı IMAGE'a değil SÜRÜME ait: iki
      # workflow paralel aynı tag'i basmaya çalışıyor (R5), ikisi de aynı
      # kapıdan geçmeli, yoksa hangisinin önce bittiği kapıyı belirler.
      - name: R6 — PATCH sürümü migration içeremez
        if: steps.version.outputs.release == 'true' && steps.version.outputs.onceki != ''
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ONCEKI="${{ steps.version.outputs.onceki }}"
          IFS=. read -r vMAJ vMIN vPAT <<< "$VERSION"
          IFS=. read -r oMAJ oMIN oPAT <<< "$ONCEKI"
          if [ "$vMAJ" = "$oMAJ" ] && [ "$vMIN" = "$oMIN" ] && [ "$vPAT" != "$oPAT" ]; then
            YENI="$(git diff --name-only "v$ONCEKI" HEAD -- api-backend/db/migrations/ | grep -c '\.sql$' || true)"
            if [ "${YENI:-0}" -gt 0 ]; then
              echo "✗ PATCH sürümü (${ONCEKI} → ${VERSION}) ${YENI} yeni migration dosyası içeriyor."
              echo "  RELEASE-STANDARD.md §2.2: PATCH migration içeremez — bu MINOR olmalı (VERSION'ı düzelt)."
              exit 1
            fi
          fi
          echo "✓ PATCH kapısı geçti"

      - name: R6b — MAJOR sürümü durak+elle_adim taşımalı
        if: steps.version.outputs.release == 'true' && steps.version.outputs.onceki != ''
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ONCEKI="${{ steps.version.outputs.onceki }}"
          vMAJ="${VERSION%%.*}"
          oMAJ="${ONCEKI%%.*}"
          if [ "$vMAJ" != "$oMAJ" ]; then
            DURAK_TRUE="$(grep -oE '"durak"[[:space:]]*:[[:space:]]*true' onprem/manifest.json || true)"
            ELLE_ADIM_BOS="$(grep -oE '"elle_adim"[[:space:]]*:[[:space:]]*\[\]' onprem/manifest.json || true)"
            if [ -z "$DURAK_TRUE" ] || [ -n "$ELLE_ADIM_BOS" ]; then
              echo "✗ MAJOR sürüm (${ONCEKI} → ${VERSION}) ama onprem/manifest.json"
              echo "  durak:true VE dolu bir elle_adim[] taşımıyor. §2.2: MAJOR = "
              echo "  'kutu bunu kendi başına atlayamaz' — durak onun makine karşılığı."
              exit 1
            fi
          fi
          echo "✓ MAJOR kapısı geçti"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ O-25/R9 (12.09.2026): `:latest` DÜŞTÜ — bu image'ı hiçbir canlı host
      # `:latest` etiketiyle çekmiyordu (yalnız on-prem kutunun `PRAXURA_FRONTEND_IMAGE`'ı
      # zaten `:stable` diyordu), yani host geçişi ön koşulu burada yoktu.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=beta
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Smoke-Test: das Image wird gestartet, BEVOR es veröffentlicht wird ──
      #
      # Gleicher Grund wie bei publish-calendar-api.yml (04.09.2026-Vorfall
      # dort): eine fehlende Datei in der COPY-Liste faellt hier NICHT beim
      # Bauen auf, sondern erst beim Anfragen genau dieser Seite — und das
      # passiert in JEDER Kundenbox gleichzeitig. Deshalb: Image bauen, mit
      # der ECHTEN Caddyfile starten, /login.html wirklich abrufen.
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./onprem/frontend.Dockerfile
          push: false
          load: true
          tags: praxura-frontend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — startet das Image, liefert es /login.html aus?
        run: |
          set -e
          docker run -d --name smoke -p 8443:443 \
            -e SITE_URL=https://smoke.local \
            -e CADDY_TLS_ARG=internal \
            -e SUPABASE_PUBLIC_URL=https://smoke.invalid \
            -e SUPABASE_PUBLIC_WSS= \
            -e HSTS_MAX_AGE=0 \
            praxura-frontend:smoke

          ok=""
          for i in $(seq 1 30); do
            if curl -fsSk --resolve smoke.local:8443:127.0.0.1 https://smoke.local:8443/login.html > /tmp/login.html 2>/dev/null; then
              echo "✓ /login.html antwortet nach ${i}s ($(wc -c < /tmp/login.html) Bytes)"
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "✗ Container läuft nicht mehr — Startfehler:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "✗ /login.html hat 30 s lang nicht geantwortet. Logs:"
            docker logs smoke
            exit 1
          fi

      # 200 fuer /login.html heisst nur: die SEITE existiert — nicht, dass
      # ihre <link>/<script>-Ziele es auch tun (O-57, 12.09.2026: fehlendes
      # assets/system.css blieb genau deshalb unbemerkt). Jede lokale
      # <link>/<script>-Referenz wird deshalb einzeln abgerufen.
      #
      # Bewusst NUR <link>/<script> (unbedingt geladen), NICHT <a href> —
      # login.html verlinkt auch auf SaaS-only-Seiten (Impressum/Datenschutz/
      # AGB/Vorregistrieren), die in der Box zur Laufzeit per JS ausgeblendet
      # werden (O-58 a, istKutu-Flag), aber im rohen HTML weiter im href
      # stehen (curl fuehrt kein JS aus). Ein <a> auf eine nicht gepackte
      # Seite ist damit kein Baufehler dieses Images.
      - name: Smoke test — jede lokale Asset-Referenz in /login.html laedt
        run: |
          set -e
          fail=0
          paths="$(grep -oE '<(link|script)[^>]*(src|href)="[^"]+"' /tmp/login.html \
            | grep -oE '(src|href)="[^"]+"$' \
            | sed -E 's/^(src|href)="//;s/"$//' \
            | grep -vE '^(https?:|//)' \
            | sort -u)"
          for path in $paths; do
            case "$path" in /*) ;; *) path="/$path" ;; esac
            code="$(curl -sk -o /dev/null -w '%{http_code}' --resolve smoke.local:8443:127.0.0.1 "https://smoke.local:8443${path}")"
            if [ "$code" = "200" ]; then
              echo "✓ ${path} -> 200"
            else
              echo "✗ ${path} -> ${code}"
              fail=1
            fi
          done
          docker rm -f smoke > /dev/null
          [ "$fail" = "0" ] || { echo "✗ Mindestens eine lokale Asset-Referenz in /login.html laedt nicht — COPY-Liste in onprem/frontend.Dockerfile pruefen."; exit 1; }

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./onprem/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # R4/R5: idempotent — api workflow'u aynı tag'i paralel basmaya çalışabilir.
      - name: Git tag (yalnız yayın koşusunda)
        if: steps.version.outputs.release == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
          if OUT="$(git push origin "$TAG" 2>&1)"; then
            echo "✓ ${TAG} basıldı"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "→ ${TAG} zaten var (eşleşen api workflow'u önce bastı) — sorun değil"
          else
            echo "✗ tag push başarısız:"
            echo "$OUT"
            exit 1
          fi
