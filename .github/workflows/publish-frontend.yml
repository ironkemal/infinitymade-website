name: Build and Publish frontend (Caddy + Oberfläche) image

on:
  push:
    branches: [main]
    paths:
      - 'login.html'
      - 'login.css'
      - 'login.js'
      - 'dashboard.html'
      - 'dashboard.css'
      - 'dashboard.js'
      - 'kalender.html'
      - 'kalender.js'
      - 'employee-signup.html'
      - 'employee-signup.js'
      - 'confirm.html'
      - 'attendance.html'
      - 'attendance.js'
      - 'booking.html'
      - 'booking.js'
      - 'booking-request.html'
      - 'booking-request.css'
      - 'booking-request.js'
      - 'nav-registry.js'
      - 'katalog-suche.js'
      - 'patient-suche.js'
      - 'calendar-widget.js'
      - 'arzt-suche.js'
      - 'icd-dg-match.js'
      - 'cookie-consent.js'
      - 'cookie-consent.css'
      - 'sentry-init.js'
      - 'supabase-config.js'
      - 'module/**'
      - 'vendor/**'
      - 'fonts/**'
      - 'assets/img/foot/**'
      - 'favicon.svg'
      - 'favicon.png'
      - 'apple-touch-icon.png'
      - 'logo.png'
      - 'onprem/Caddyfile'
      - 'onprem/frontend.Dockerfile'
      - '.github/workflows/publish-frontend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Smoke-Test: das Image wird gestartet, BEVOR es veröffentlicht wird ──
      #
      # Gleicher Grund wie bei publish-calendar-api.yml (04.09.2026-Vorfall
      # dort): eine fehlende Datei in der COPY-Liste faellt hier NICHT beim
      # Bauen auf, sondern erst beim Anfragen genau dieser Seite — und das
      # passiert in JEDER Kundenbox gleichzeitig. Deshalb: Image bauen, mit
      # der ECHTEN Caddyfile starten, /login.html wirklich abrufen.
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./onprem/frontend.Dockerfile
          push: false
          load: true
          tags: praxura-frontend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — startet das Image, liefert es /login.html aus?
        run: |
          set -e
          docker run -d --name smoke -p 8443:443 \
            -e SITE_URL=https://smoke.local \
            -e CADDY_TLS_ARG=internal \
            -e SUPABASE_PUBLIC_URL=https://smoke.invalid \
            -e SUPABASE_PUBLIC_WSS= \
            -e HSTS_MAX_AGE=0 \
            praxura-frontend:smoke

          for i in $(seq 1 30); do
            if curl -fsSk --resolve smoke.local:8443:127.0.0.1 https://smoke.local:8443/login.html > /tmp/login.html 2>/dev/null; then
              echo "✓ /login.html antwortet nach ${i}s ($(wc -c < /tmp/login.html) Bytes)"
              docker rm -f smoke > /dev/null
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "✗ Container läuft nicht mehr — Startfehler:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          echo "✗ /login.html hat 30 s lang nicht geantwortet. Logs:"
          docker logs smoke
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./onprem/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
