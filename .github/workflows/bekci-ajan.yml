name: Bekçi-Ajan (denkender Prüfer)

# tools/bekci-ajan/SPEC.md · guvenlik S-64 · onprem O-257 · Kemal-Entscheidung 24.11.2026 (K-A1..K-A5).
#
# Ablauf für bekci=preise:
#   hazirla  (lesen)      Preiswächter im Trockenlauf → bericht.json; bei eylem≠yeni den Fall aus `bekci-vakalar`
#   ajan     (lesen)      Claude liest bericht + Vertragstexte (wissensbank/) → bekci-out/karar.json (NUR Werte, kein Code)
#   bewerten (lesen)      deterministische Entscheidung (preise-bewerten.mjs). Darf geschrieben werden, schreibt
#                         preise_autoupdate.mjs (nicht der Agent) mit --erlaube-sprung; Tor dogrula.mjs; npm test;
#                         Seed-SQL → Artefakt `preise-aenderung` (gleicher Vertrag wie preise-check.yml, S-28)
#   uebernehmen (schreiben) preise-uebernehmen.yml — derselbe Schreibweg wie der tägliche Preiswächter
#   bildir   (schreibt nur Zweig bekci-vakalar)  kurzer Bericht oder Fall mit Knöpfen an Kemal
#
# Sicherheit (S-64): Trigger NUR workflow_dispatch (von preise-check.yml / bekci-cevap.yml / Hand).
# Claude-Token nur in Environment `bekci-ajan` (auf main beschränken), nur im Job `ajan`; dort keine
# Telegram-Secrets, kein Bash/WebFetch für den Agenten, kein Schreibrecht. Action per Commit-SHA fest.
# Schalter: nichts läuft, solange Repo-Variable BEKCI_AJAN nicht `an` ist.

on:
  workflow_dispatch:
    inputs:
      bekci:
        type: choice
        options: [preise]
        default: preise
      eylem:
        type: choice
        options: [yeni, uygula, acikla]
        default: yeni
      vaka_id:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bekci-ajan-${{ inputs.bekci }}
  cancel-in-progress: false

jobs:
  hazirla:
    if: vars.BEKCI_AJAN == 'an'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # upload-artifact
    outputs:
      needs_review: ${{ steps.dedupe.outputs.needs_review }}
    steps:
      - name: Eingaben prüfen
        env:
          EYLEM: ${{ inputs.eylem }}
          VAKA: ${{ inputs.vaka_id }}
        run: |
          set -euo pipefail
          if [ "$EYLEM" != yeni ]; then
            [[ "$VAKA" =~ ^[0-9]{8}-preise-[0-9]{1,3}$ ]] || { echo "::error::vaka_id ungültig"; exit 1; }
          else
            [ -z "$VAKA" ] || { echo "::error::bei eylem=yeni keine vaka_id"; exit 1; }
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten (ohne Install-Skripte)
        working-directory: ./api-backend
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Fall laden (uygula/acikla)
        if: inputs.eylem != 'yeni'
        env:
          EYLEM: ${{ inputs.eylem }}
          VAKA: ${{ inputs.vaka_id }}
        run: |
          set -euo pipefail
          mkdir -p bekci-in
          git fetch --quiet --depth 1 "https://github.com/${{ github.repository }}.git" bekci-vakalar
          git show "FETCH_HEAD:vakalar/${VAKA}.json" > bekci-in/vaka.json
          node -e '
            const v = JSON.parse(require("fs").readFileSync("bekci-in/vaka.json","utf8"));
            const soll = process.env.EYLEM === "uygula" ? "uygulaniyor" : "acik";
            if (v.id !== process.env.VAKA || v.durum !== soll) { console.error("Fall-Zustand passt nicht:", v.durum); process.exit(1); }'

      - name: Preiswächter im Trockenlauf
        id: bericht
        working-directory: ./api-backend
        run: |
          set -euo pipefail
          mkdir -p ../bekci-in
          node preise_autoupdate.mjs --dry-run > ../bekci-in/autoupdate-out.txt
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync("../bekci-in/autoupdate-out.txt","utf8").split("---JSON---").pop().trim().split("\n").pop();
            const b = JSON.parse(t);
            fs.writeFileSync("../bekci-in/bericht.json", JSON.stringify(b, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "needs_review_roh=" + ((b.needsReview||[]).length > 0) + "\n");'

      - name: Schon ein offener Fall zu genau diesem Befund? (dann kein Agent — Erinnerung macht bekci-cevap.yml)
        id: dedupe
        env:
          EYLEM: ${{ inputs.eylem }}
          ROH: ${{ steps.bericht.outputs.needs_review_roh }}
        run: |
          set -euo pipefail
          nr="$ROH"
          if [ "$EYLEM" = yeni ] && [ "$ROH" = true ]; then
            mkdir -p bekci-in/_vakalar
            if git fetch --quiet --depth 1 "https://github.com/${{ github.repository }}.git" bekci-vakalar 2>/dev/null; then
              git --work-tree=bekci-in/_vakalar checkout FETCH_HEAD -- vakalar 2>/dev/null || true
              git reset --quiet
            fi
            out=$(node tools/bekci-ajan/cli.mjs acik-iz --dizin=bekci-in/_vakalar/vakalar --bekci=preise --bericht=bekci-in/bericht.json)
            echo "$out"
            if echo "$out" | grep -qx 'zaten_acik=true'; then nr=false; fi
          fi
          echo "needs_review=$nr" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bekci-in
          path: bekci-in/
          retention-days: 7

  ajan:
    needs: hazirla
    if: needs.hazirla.outputs.needs_review == 'true' && inputs.eylem != 'uygula'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: bekci-ajan
    permissions:
      contents: read
      actions: write   # upload-artifact
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: bekci-in
          path: bekci-in

      - run: mkdir -p bekci-out

      - name: Claude prüft den Fall
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Lies tools/bekci-ajan/prompts/preise.md vollständig und führe genau die dort beschriebene Aufgabe aus.
            ${{ inputs.eylem == 'acikla' && 'Zusatz (Kemal hat auf "Açıkla" gedrückt, Fall in bekci-in/vaka.json): schreibe ZUSÄTZLICH bekci-out/aciklama.md — auf Türkisch, Alltagssprache, höchstens 15 kurze Zeilen: was ist passiert, warum hat der Wächter nicht selbst entschieden, was würdest du tun und warum. Zahlen nur, wenn du sie selbst in der Quelle gelesen hast, mit Datei:Zeile.' || '' }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write"
            --disallowedTools "Bash,WebFetch,WebSearch,Edit,MultiEdit,NotebookEdit,Task,Read(//proc/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**),Read(//tmp/**),Read(//run/**)"

      - name: Nur bekci-out/ geschrieben?
        run: |
          set -euo pipefail
          fremd=$(git status --porcelain --untracked-files=all --ignored | awk '{print $2}' | grep -vE '^(bekci-in|bekci-out)/' || true)
          if [ -n "$fremd" ]; then echo "::error::Agent hat ausserhalb von bekci-out/ geschrieben:"; echo "$fremd"; exit 1; fi

      - name: Agent-Ausgabe prüfen (Schema + Geheimnis-Filter, S-64) — vor dem öffentlichen Artefakt
        run: |
          set -euo pipefail
          [ -f bekci-out/karar.json ] || exit 0
          node tools/bekci-ajan/cli.mjs karar-temizle --bekci=preise --dosya=bekci-out/karar.json --aciklama=bekci-out/aciklama.md

      - uses: actions/upload-artifact@v4
        with:
          name: bekci-out
          path: bekci-out/
          if-no-files-found: ignore
          retention-days: 7

  bewerten:
    needs: [hazirla, ajan]
    if: always() && needs.hazirla.result == 'success' && needs.hazirla.outputs.needs_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write   # upload-artifact
    outputs:
      karar: ${{ steps.karar.outputs.karar }}
      hat_yama: ${{ steps.yama.outputs.hat_yama }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten (ohne Install-Skripte)
        working-directory: ./api-backend
        run: npm ci --no-audit --no-fund --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: bekci-in
          path: bekci-in

      - uses: actions/download-artifact@v4
        continue-on-error: true   # Agent kann ausgefallen sein → Fall mit "Ajan çalışmadı."
        with:
          name: bekci-out
          path: bekci-out

      - name: Entscheiden
        id: karar
        env:
          EYLEM: ${{ inputs.eylem }}
        run: |
          set -euo pipefail
          if [ "$EYLEM" = acikla ]; then echo "karar=aciklama" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EYLEM" = uygula ]; then
            # Kemal hat ✅ gedrückt: dieselben Codes wie bei der Fall-Erstellung, dieselbe Yama (SHA).
            node -e '
              const v = JSON.parse(require("fs").readFileSync("bekci-in/vaka.json","utf8"));
              const e = { karar: (v.ek?.erlaubeSprung||[]).length ? "auto" : "elle", erlaubeSprung: v.ek?.erlaubeSprung||[] };
              require("fs").writeFileSync("bekci-in/entscheidung.json", JSON.stringify(e));'
            node tools/bekci-ajan/cli.mjs karar-oku --file=bekci-in/entscheidung.json | sed 's/^karar=auto$/karar=onay/' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/bekci-ajan/preise-bewerten.mjs --bericht=bekci-in/bericht.json --karar=bekci-out/karar.json --out=bekci-in/entscheidung.json
          node tools/bekci-ajan/cli.mjs karar-oku --file=bekci-in/entscheidung.json >> "$GITHUB_OUTPUT"

      - name: Yama erzeugen (schreibt preise_autoupdate.mjs, nicht der Agent)
        id: yama
        if: steps.karar.outputs.karar == 'auto' || steps.karar.outputs.karar == 'onay' || steps.karar.outputs.karar == 'vaka'
        working-directory: ./api-backend
        env:
          ERLAUBE: ${{ steps.karar.outputs.erlaube_sprung }}
        run: |
          set -euo pipefail
          : > ../bekci-in/yama.patch
          [ -n "$ERLAUBE" ] || exit 0
          node preise_autoupdate.mjs --erlaube-sprung="$ERLAUBE" > ../bekci-in/autoupdate-schreib.txt
          git diff -- billing/codes/ > ../bekci-in/yama.patch
          echo "hat_yama=$([ -s ../bekci-in/yama.patch ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Tor (dogrula.mjs) — bei uygula gegen die SHA aus dem Fall
        if: steps.yama.outputs.hat_yama == 'true'
        env:
          EYLEM: ${{ inputs.eylem }}
        run: |
          set -euo pipefail
          SHA=""
          if [ "$EYLEM" = uygula ]; then
            SHA=$(node -p 'JSON.parse(require("fs").readFileSync("bekci-in/vaka.json","utf8")).yamaSha256 || ""')
            # Ohne gebundene Yama wird nichts übernommen — sonst würde der HEUTIGE statt des gezeigten Stands geschrieben
            [[ "$SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Fall hat keine gebundene Yama-SHA"; exit 1; }
          fi
          node tools/bekci-ajan/cli.mjs yama-kontrol --patch=bekci-in/yama.patch --preset=preise ${SHA:+--beklenen-sha=$SHA} --out=bekci-in/yama-kontrol.json

      - name: Vaka-Fall — Änderung wieder verwerfen (nur SHA + Übersicht bleiben)
        if: steps.karar.outputs.karar == 'vaka'
        run: git checkout -- api-backend/billing/codes/

      - name: Tests + Seed-SQL (nur wenn wirklich übernommen wird)
        if: (steps.karar.outputs.karar == 'auto' || steps.karar.outputs.karar == 'onay') && steps.yama.outputs.hat_yama == 'true'
        working-directory: ./api-backend
        run: |
          set -euo pipefail
          npm test
          node sync_heilmittel_katalog.js --sql > preise-seed.sql
          node -e '
            const k = JSON.parse(require("fs").readFileSync("../bekci-in/yama-kontrol.json","utf8"));
            require("fs").writeFileSync("preise-telegram-message.txt", "Bekçi-Ajan (Vertragstext + XML übereinstimmend):\n" + (k.ozet||[]).join("\n") + "\n");'

      - name: Artefakt für den Schreibweg (gleicher Vertrag wie preise-check.yml)
        if: (steps.karar.outputs.karar == 'auto' || steps.karar.outputs.karar == 'onay') && steps.yama.outputs.hat_yama == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preise-aenderung
          path: |
            api-backend/billing/codes/podologie_positions.js
            api-backend/billing/codes/physio_positions.js
            api-backend/preise-seed.sql
            api-backend/preise-telegram-message.txt
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bekci-karar
          path: bekci-in/
          retention-days: 7

  uebernehmen:
    needs: bewerten
    if: (needs.bewerten.outputs.karar == 'auto' || needs.bewerten.outputs.karar == 'onay') && needs.bewerten.outputs.hat_yama == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/preise-uebernehmen.yml
    with:
      sessiz: true
    secrets:
      tg_token: ${{ secrets.TELEGRAM_BEKCI_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      tg_chat: ${{ secrets.TELEGRAM_BEKCI_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}

  bildir:
    needs: [hazirla, ajan, bewerten, uebernehmen]
    if: always() && needs.hazirla.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # nur Zweig bekci-vakalar
      actions: read     # download-artifact
    env:
      TELEGRAM_BEKCI_BOT_TOKEN: ${{ secrets.TELEGRAM_BEKCI_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BEKCI_CHAT_ID: ${{ secrets.TELEGRAM_BEKCI_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BEKCI_USER_ID: ${{ secrets.TELEGRAM_BEKCI_USER_ID || secrets.TELEGRAM_BEKCI_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EYLEM: ${{ inputs.eylem }}
      VAKA: ${{ inputs.vaka_id }}
      KARAR: ${{ needs.bewerten.outputs.karar }}
      R_HAZIRLA: ${{ needs.hazirla.result }}
      R_BEWERTEN: ${{ needs.bewerten.result }}
      R_UEBERNEHMEN: ${{ needs.uebernehmen.result }}
      NEEDS_REVIEW: ${{ needs.hazirla.outputs.needs_review }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bekci-karar
          path: bekci-in

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bekci-out
          path: bekci-out

      - name: Fall-Zweig auschecken (oder neu anlegen)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" bekci-vakalar >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch bekci-vakalar "$URL" vakalar
          else
            mkdir vakalar && cd vakalar && git init --quiet -b bekci-vakalar && git remote add origin "$URL" \
              && mkdir -p vakalar && printf '{"offset":0}\n' > offset.json
          fi

      - name: Melden
        run: |
          set -euo pipefail
          CLI="node main/tools/bekci-ajan/cli.mjs"
          : > gonder.sh
          # Nachrichten erst NACH dem Speichern des Fall-Zweigs senden (Knopfdruck vor dem Push fände den Fall nicht)
          gonder() { printf "%q " "$@" >> gonder.sh; echo >> gonder.sh; }
          D=vakalar/vakalar
          mkdir -p "$D"
          fehler=0
          [ "$R_HAZIRLA" = success ] || fehler=1
          [ "$R_BEWERTEN" = success ] || [ "$R_BEWERTEN" = skipped ] || fehler=1
          [ "$R_UEBERNEHMEN" = success ] || [ "$R_UEBERNEHMEN" = skipped ] || fehler=1

          if [ "$fehler" = 1 ]; then
            if [ "$EYLEM" = uygula ] && [ -n "$VAKA" ]; then $CLI vaka-durum --dizin="$D" --id="$VAKA" --eylem=hata || true; fi
            gonder $CLI bildir --tur=hata ${VAKA:+--dizin="$D" --id="$VAKA"} --link="$LINK"
            exit 0
          fi
          if [ "$NEEDS_REVIEW" != true ]; then
            # Beim Nachfassen hat sich die Lage erledigt (z. B. jemand hat es von Hand korrigiert).
            if [ -n "$VAKA" ]; then $CLI vaka-durum --dizin="$D" --id="$VAKA" --eylem=hata || true; fi
            exit 0
          fi
          case "$KARAR" in
            auto)
              node -e 'const k=JSON.parse(require("fs").readFileSync("bekci-in/yama-kontrol.json","utf8"));require("fs").writeFileSync("ozet.txt",(k.ozet||[]).join("\n"))'
              gonder $CLI bildir --tur=auto --dosya=ozet.txt --link="$LINK" ;;
            onay)
              if [ "$R_UEBERNEHMEN" = success ]; then
                $CLI vaka-durum --dizin="$D" --id="$VAKA" --eylem=tamam
                gonder $CLI bildir --tur=uygulandi --dizin="$D" --id="$VAKA" --link="$LINK"
              else
                # keine Yama mehr (z. B. schon von Hand übernommen) → nichts geschrieben, Fall wieder offen
                $CLI vaka-durum --dizin="$D" --id="$VAKA" --eylem=hata
                gonder $CLI bildir --tur=elle --dizin="$D" --id="$VAKA"
              fi ;;
            elle)
              $CLI vaka-durum --dizin="$D" --id="$VAKA" --eylem=hata
              gonder $CLI bildir --tur=elle --dizin="$D" --id="$VAKA" ;;
            aciklama)
              if [ -s bekci-out/aciklama.md ]; then gonder $CLI bildir --tur=aciklama --dizin="$D" --id="$VAKA" --dosya=bekci-out/aciklama.md
              else gonder $CLI bildir --tur=hata --dizin="$D" --id="$VAKA" --link="$LINK"; fi ;;
            vaka)
              PATCH_ARG=""; [ -s bekci-in/yama.patch ] && PATCH_ARG="--patch=bekci-in/yama.patch"
              $CLI vaka-ac --entscheidung=bekci-in/entscheidung.json --dizin="$D" $PATCH_ARG --out-id=neu-id.txt
              # Leere ID = derselbe Fall ist schon offen → keine zweite Nachricht (Erinnerung macht bekci-cevap.yml)
              if [ -s neu-id.txt ]; then gonder $CLI bildir --tur=vaka --dizin="$D" --id="$(cat neu-id.txt)"; fi ;;
            *)
              gonder $CLI bildir --tur=hata --link="$LINK" ;;
          esac

      - name: Fall-Zweig speichern
        if: always()
        working-directory: vakalar
        run: |
          set -euo pipefail
          # Vercel soll diesen Datenzweig nie bauen (sonst Fehl-Deploys, 25.11.2026)
          [ -f vercel.json ] || echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="praxura-bekci" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "bekci: Fälle aktualisiert"
          for i in 1 2 3; do git push --quiet origin HEAD:bekci-vakalar && exit 0; git pull --quiet --rebase origin bekci-vakalar || true; done
          exit 1

      - name: Nachrichten senden (nach dem Speichern)
        if: always()
        run: |
          set -uo pipefail
          [ -s gonder.sh ] || exit 0
          bash gonder.sh
