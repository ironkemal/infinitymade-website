name: Build and Publish calendar-api image

on:
  push:
    branches: [main]
    paths:
      - 'api-backend/**'
      - '.github/workflows/publish-calendar-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/calendar-api

jobs:
  # Gate: Watchtower zieht ein neues Image innerhalb von ~60 s in die Produktion.
  # Zwischen Build und Live gibt es sonst keine Kontrolle — deshalb laufen die Tests
  # VOR dem Publish. Schlägt ein Test fehl, wird kein Image veröffentlicht.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # muss zu Dockerfile (node:22-alpine) passen

      - name: Install dependencies
        working-directory: ./api-backend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ./api-backend
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api-backend
          file: ./api-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
