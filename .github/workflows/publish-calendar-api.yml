name: Build and Publish calendar-api image

on:
  push:
    branches: [main]
    paths:
      - 'api-backend/**'
      # onprem-bundle (O-45 (b), Dockerfile COPY --from=onprem): dieselbe
      # Lehre wie O-57 beim Frontend-Image — eine geänderte Datei, die hier
      # NICHT aufgeführt ist, baut kein neues Image, die Box bleibt auf dem
      # alten Bundle-Stand stehen (onprem/REGISTER.md §7J).
      - 'onprem/docker-compose.yml'
      - 'onprem/.env.template'
      - 'onprem/install.sh'
      - 'onprem/update.sh'
      - 'onprem/lib-health.sh'
      - 'onprem/manifest.json'
      - 'onprem/volumes/api/kong.yml'
      - 'onprem/volumes/api/kong-entrypoint.sh'
      - 'onprem/volumes/db/*.sql'
      - '.github/workflows/publish-calendar-api.yml'
      # O-25/R5 (12.09.2026): api- und frontend-Image teilen sich EINE Produkt-
      # version (VERSION am Repo-Root). Jede Änderung daran löst BEIDE Workflows
      # aus — auch wenn dieses Image inhaltlich unverändert bliebe — weil die
      # Kunden-Box das Paar als eine gemeinsam getestete Einheit sieht (§2.3).
      - 'VERSION'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/calendar-api

jobs:
  # Gate: Watchtower zieht ein neues Image innerhalb von ~60 s in die Produktion.
  # Zwischen Build und Live gibt es sonst keine Kontrolle — deshalb laufen die Tests
  # VOR dem Publish. Schlägt ein Test fehl, wird kein Image veröffentlicht.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # muss zu Dockerfile (node:22-alpine) passen

      - name: Install dependencies
        working-directory: ./api-backend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ./api-backend
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # R4: yayın koşusunda git tag push'lanıyor — contents: write şart.
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O-25/R3-R6: Release-Erkennung und die PATCH/MAJOR-Tore brauchen die
          # volle Tag-Historie, nicht nur den letzten Commit.
          fetch-depth: 0

      # ── Sürüm bilgisi (O-25, RELEASE-STANDARD.md §2.2-§2.3) ──
      #
      # "Yayın koşusu" = kök VERSION dosyasının değeri henüz bir git tag'i olarak
      # basılmamış demek — diff değil DURUM ölçülüyor (yeniden koşturma,
      # workflow_dispatch, force-push diff'i yanıltır, durumu yanıltmaz — R3).
      - name: Sürüm bilgisi
        id: version
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "→ v$VERSION zaten basılmış — bu bir yayın koşusu değil, yalnız :beta + sha"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "→ v$VERSION henüz yok — bu bir YAYIN koşusu, X.Y.Z de basılacak"
          fi

          ONCEKI="$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
          echo "onceki=$ONCEKI" >> "$GITHUB_OUTPUT"
          echo "→ önceki yayın: ${ONCEKI:-<yok — ilk yayın>}"

      # ── R6 — PATCH sürümü migration içeremez (RELEASE-STANDARD.md §2.2) ──
      #
      # "Sürüm niyet taşır" cümlesinin makine tarafından kontrol edilebilen tek
      # parçası budur: PATCH bozuksa geri dönüş "eski digest'e sabitle"dir, veri
      # kaybı yok, yedek gerekmez — ama migration içeriyorsa bu artık MINOR'un
      # ağır makinesini (yedek + soak) hak eden bir değişikliktir.
      - name: R6 — PATCH sürümü migration içeremez
        if: steps.version.outputs.release == 'true' && steps.version.outputs.onceki != ''
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ONCEKI="${{ steps.version.outputs.onceki }}"
          IFS=. read -r vMAJ vMIN vPAT <<< "$VERSION"
          IFS=. read -r oMAJ oMIN oPAT <<< "$ONCEKI"
          if [ "$vMAJ" = "$oMAJ" ] && [ "$vMIN" = "$oMIN" ] && [ "$vPAT" != "$oPAT" ]; then
            YENI="$(git diff --name-only "v$ONCEKI" HEAD -- api-backend/db/migrations/ | grep -c '\.sql$' || true)"
            if [ "${YENI:-0}" -gt 0 ]; then
              echo "✗ PATCH sürümü (${ONCEKI} → ${VERSION}) ${YENI} yeni migration dosyası içeriyor."
              echo "  RELEASE-STANDARD.md §2.2: PATCH migration içeremez — bu MINOR olmalı (VERSION'ı düzelt)."
              exit 1
            fi
          fi
          echo "✓ PATCH kapısı geçti"

      # ── R6b — MAJOR sürümü durak ilan etmek zorunda (RELEASE-STANDARD.md §2.2/§3.4) ──
      - name: R6b — MAJOR sürümü durak+elle_adim taşımalı
        if: steps.version.outputs.release == 'true' && steps.version.outputs.onceki != ''
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          ONCEKI="${{ steps.version.outputs.onceki }}"
          vMAJ="${VERSION%%.*}"
          oMAJ="${ONCEKI%%.*}"
          if [ "$vMAJ" != "$oMAJ" ]; then
            DURAK_TRUE="$(grep -oE '"durak"[[:space:]]*:[[:space:]]*true' onprem/manifest.json || true)"
            ELLE_ADIM_BOS="$(grep -oE '"elle_adim"[[:space:]]*:[[:space:]]*\[\]' onprem/manifest.json || true)"
            if [ -z "$DURAK_TRUE" ] || [ -n "$ELLE_ADIM_BOS" ]; then
              echo "✗ MAJOR sürüm (${ONCEKI} → ${VERSION}) ama onprem/manifest.json"
              echo "  durak:true VE dolu bir elle_adim[] taşımıyor. §2.2: MAJOR = "
              echo "  'kutu bunu kendi başına atlayamaz' — durak onun makine karşılığı."
              exit 1
            fi
          fi
          echo "✓ MAJOR kapısı geçti"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ O-25/R9 (12.09.2026): `:latest` DÜŞTÜ. SaaS VPS'i host'ta `:beta`'ya
      # çevrildi ve doğrulandı (`docker inspect` → image=beta, healthy,
      # `/health` 200 gerçek domainden) — sıra §6.4'ün istediği gibi tamamlandı,
      # şimdi CI'dan kaldırmak Watchtower'ı köreltmiyor.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=beta
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Smoke-Test: das Image wird gestartet, BEVOR es veröffentlicht wird ──
      #
      # Warum das hier stehen muss (04.09.2026):
      # `npm test` oben prüft Funktionen, nicht das Image. Zweimal ist genau
      # dadurch ein Container in die Produktion gegangen, der gar nicht startet:
      #   • 11.08.2026 — booking/ fehlte in der COPY-Liste des Dockerfiles
      #     -> ERR_MODULE_NOT_FOUND -> PM2-Restart-Loop -> Traefik 502
      #   • davor — SUPABASE_SERVICE_KEY statt ...SERVICE_ROLE_KEY -> exit(1)
      # Beide Male waren die Tests grün und Watchtower hatte das kaputte Image
      # in ~60 s live. Es gab keine Kontrolle dazwischen. Jetzt gibt es eine.
      #
      # On-Prem wiegt das schwerer: dort passiert derselbe Fehler am selben
      # Morgen in JEDER Kundenbox gleichzeitig (ONPREM_MIGRATION_PLAYBOOK.md,
      # onprem/RELEASE-STANDARD.md, Register O-40/O-41).
      #
      # Der Test läuft mit dem ECHTEN CMD (pm2-runtime) — nicht mit `npm start`,
      # nicht mit `npx`. Der Unterschied war schon einmal die Ursache.
      # Die Zugangsdaten sind absichtlich Dummys: geprüft wird der Start, nicht
      # die Funktion. Deshalb fragt der Test /health (Leben) und nicht
      # /health/ready (das ohne echte DB korrekterweise 503 gäbe).
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: ./api-backend
          file: ./api-backend/Dockerfile
          build-contexts: |
            onprem=./onprem
          push: false
          load: true
          tags: calendar-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — startet das Image mit seinem echten CMD?
        run: |
          set -e
          docker run -d --name smoke -p 3000:3000 \
            -e SUPABASE_URL=https://smoke.invalid \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke-dummy-key \
            -e GOOGLE_CLIENT_ID=smoke \
            -e GOOGLE_CLIENT_SECRET=smoke \
            -e GOOGLE_REDIRECT_URL=https://smoke.invalid/cb \
            calendar-api:smoke

          # 30 s Geduld: PM2 forkt zwei Worker, das dauert im Runner spürbar.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/health.json 2>/dev/null; then
              echo "✓ Container antwortet nach ${i}s:"
              cat /tmp/health.json
              docker rm -f smoke > /dev/null
              exit 0
            fi
            # Vorzeitig abbrechen, wenn der Container schon gestorben ist.
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "✗ Container läuft nicht mehr — Startfehler:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          echo "✗ /health hat 30 s lang nicht geantwortet. Logs:"
          docker logs smoke
          exit 1

      # O-45 (b): das onprem-Bundle ist die EINZIGE Art, wie Dateien wie
      # docker-compose.yml/no-pg-net.sql je auf eine Kundenbox gelangen
      # (update.sh zieht es aus genau diesem Image). Fehlt es, aktualisiert
      # sich keine Box mehr, ohne dass irgendwo ein Fehler auftaucht.
      #
      # ⚠️ O-25/R0 (12.09.2026): die alte Version dieser Prüfung verlangte, dass
      # manifest.json die Zeichenkette "manifest.json" selbst enthält — die Datei
      # listet aber bewusst nur die ANDEREN Bundle-Dateien, nicht sich selbst
      # (tools/onprem-manifest.mjs). Damit schlug dieser Schritt seit `6347071`
      # bei JEDEM Lauf fehl und kein calendar-api-Image wurde seither published.
      # Jetzt zwei getrennte, in beide Richtungen geprüfte Fragen:
      #   (a) Ist jede Bundle-Datei wirklich im Image? (fängt O-57-Klasse)
      #   (b) Listet manifest.json genau die ANDEREN Dateien — nicht mehr,
      #       nicht weniger? (die Rückrichtung — im Manifest gelistet, aber im
      #       Bundle fehlend — lief bisher NIE mit und lässt update.sh nachts
      #       auf einer Kundenbox scheitern)
      # ⚠️ O-26 (13.09.2026): backup.sh dazugekommen — 15 Dateien, 14 ANDERE.
      - name: Smoke test — onprem-Bundle ist im Image
        run: |
          set -e
          BUNDLE_DATEIEN="docker-compose.yml .env.template install.sh update.sh lib-health.sh backup.sh manifest.json volumes/api/kong.yml volumes/api/kong-entrypoint.sh volumes/db/webhooks.sql volumes/db/no-pg-net.sql volumes/db/roles.sql volumes/db/jwt.sql volumes/db/realtime.sql volumes/db/_supabase.sql"
          bundle_anzahl=$(echo $BUNDLE_DATEIEN | wc -w)

          docker create --name bundle-check calendar-api:smoke >/dev/null
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle
          docker cp bundle-check:/app/onprem-bundle/. /tmp/bundle/
          docker rm -f bundle-check >/dev/null

          # (a) jede Datei wirklich im Image?
          for datei in $BUNDLE_DATEIEN; do
            if [ ! -f "/tmp/bundle/$datei" ]; then
              echo "✗ im Bundle fehlend: $datei"
              exit 1
            fi
          done
          echo "✓ ${bundle_anzahl}/${bundle_anzahl} Bundle-Dateien im Image vorhanden"

          # (b) manifest.json listet genau die 13 ANDEREN Dateien — beide Richtungen.
          for datei in $BUNDLE_DATEIEN; do
            [ "$datei" = "manifest.json" ] && continue
            if ! grep -q "\"$datei\"" /tmp/bundle/manifest.json; then
              echo "✗ manifest.json listet nicht: $datei"
              exit 1
            fi
          done
          erwartet=$(( $(echo $BUNDLE_DATEIEN | wc -w) - 1 ))
          gelistet=$(grep -oE '"yol"[[:space:]]*:[[:space:]]*"[^"]+"' /tmp/bundle/manifest.json | wc -l)
          if [ "$gelistet" -ne "$erwartet" ]; then
            echo "✗ manifest.json listet ${gelistet} Datei(en), erwartet ${erwartet} — überzählige/verwaiste Einträge"
            exit 1
          fi
          echo "✓ manifest.json listet genau ${erwartet}/${erwartet} Dateien, keine überzähligen"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api-backend
          file: ./api-backend/Dockerfile
          build-contexts: |
            onprem=./onprem
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # R4: git tag bir KAYNAK değil, YAN ÜRÜNdür — R6/R6b'nin "önceki sürüm"
      # hesabı ve `git show v1.4.3:VERSION` türü karşılaştırmalar onun üstünde
      # durur. Yalnız yayın koşusunda ve build+push başarılıysa basılır.
      #
      # ⚠️ R5: api ve frontend workflow'ları AYNI push'ta paralel tetiklenir ve
      # ikisi de aynı "v$VERSION" tag'ini basmaya çalışır — hangisi önce
      # bitirirse. Bu yüzden idempotent: tag zaten varsa (diğer workflow bastıysa)
      # hata değil, bilgi mesajıdır.
      - name: Git tag (yalnız yayın koşusunda)
        if: steps.version.outputs.release == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG" 2>/dev/null || true
          if OUT="$(git push origin "$TAG" 2>&1)"; then
            echo "✓ ${TAG} basıldı"
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "→ ${TAG} zaten var (eşleşen frontend workflow'u önce bastı) — sorun değil"
          else
            echo "✗ tag push başarısız:"
            echo "$OUT"
            exit 1
          fi
