name: Build and Publish calendar-api image

on:
  push:
    branches: [main]
    paths:
      - 'api-backend/**'
      # onprem-bundle (O-45 (b), Dockerfile COPY --from=onprem): dieselbe
      # Lehre wie O-57 beim Frontend-Image — eine geänderte Datei, die hier
      # NICHT aufgeführt ist, baut kein neues Image, die Box bleibt auf dem
      # alten Bundle-Stand stehen (onprem/REGISTER.md §7J).
      - 'onprem/docker-compose.yml'
      - 'onprem/.env.template'
      - 'onprem/install.sh'
      - 'onprem/update.sh'
      - 'onprem/lib-health.sh'
      - 'onprem/manifest.json'
      - 'onprem/volumes/api/kong.yml'
      - 'onprem/volumes/api/kong-entrypoint.sh'
      - 'onprem/volumes/db/*.sql'
      - '.github/workflows/publish-calendar-api.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/calendar-api

jobs:
  # Gate: Watchtower zieht ein neues Image innerhalb von ~60 s in die Produktion.
  # Zwischen Build und Live gibt es sonst keine Kontrolle — deshalb laufen die Tests
  # VOR dem Publish. Schlägt ein Test fehl, wird kein Image veröffentlicht.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # muss zu Dockerfile (node:22-alpine) passen

      - name: Install dependencies
        working-directory: ./api-backend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ./api-backend
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Smoke-Test: das Image wird gestartet, BEVOR es veröffentlicht wird ──
      #
      # Warum das hier stehen muss (04.09.2026):
      # `npm test` oben prüft Funktionen, nicht das Image. Zweimal ist genau
      # dadurch ein Container in die Produktion gegangen, der gar nicht startet:
      #   • 11.08.2026 — booking/ fehlte in der COPY-Liste des Dockerfiles
      #     -> ERR_MODULE_NOT_FOUND -> PM2-Restart-Loop -> Traefik 502
      #   • davor — SUPABASE_SERVICE_KEY statt ...SERVICE_ROLE_KEY -> exit(1)
      # Beide Male waren die Tests grün und Watchtower hatte das kaputte Image
      # in ~60 s live. Es gab keine Kontrolle dazwischen. Jetzt gibt es eine.
      #
      # On-Prem wiegt das schwerer: dort passiert derselbe Fehler am selben
      # Morgen in JEDER Kundenbox gleichzeitig (ONPREM_MIGRATION_PLAYBOOK.md,
      # onprem/RELEASE-STANDARD.md, Register O-40/O-41).
      #
      # Der Test läuft mit dem ECHTEN CMD (pm2-runtime) — nicht mit `npm start`,
      # nicht mit `npx`. Der Unterschied war schon einmal die Ursache.
      # Die Zugangsdaten sind absichtlich Dummys: geprüft wird der Start, nicht
      # die Funktion. Deshalb fragt der Test /health (Leben) und nicht
      # /health/ready (das ohne echte DB korrekterweise 503 gäbe).
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: ./api-backend
          file: ./api-backend/Dockerfile
          build-contexts: |
            onprem=./onprem
          push: false
          load: true
          tags: calendar-api:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — startet das Image mit seinem echten CMD?
        run: |
          set -e
          docker run -d --name smoke -p 3000:3000 \
            -e SUPABASE_URL=https://smoke.invalid \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke-dummy-key \
            -e GOOGLE_CLIENT_ID=smoke \
            -e GOOGLE_CLIENT_SECRET=smoke \
            -e GOOGLE_REDIRECT_URL=https://smoke.invalid/cb \
            calendar-api:smoke

          # 30 s Geduld: PM2 forkt zwei Worker, das dauert im Runner spürbar.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/health.json 2>/dev/null; then
              echo "✓ Container antwortet nach ${i}s:"
              cat /tmp/health.json
              docker rm -f smoke > /dev/null
              exit 0
            fi
            # Vorzeitig abbrechen, wenn der Container schon gestorben ist.
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "✗ Container läuft nicht mehr — Startfehler:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          echo "✗ /health hat 30 s lang nicht geantwortet. Logs:"
          docker logs smoke
          exit 1

      # O-45 (b): das onprem-Bundle ist die EINZIGE Art, wie Dateien wie
      # docker-compose.yml/no-pg-net.sql je auf eine Kundenbox gelangen
      # (update.sh zieht es aus genau diesem Image). Fehlt es, aktualisiert
      # sich keine Box mehr, ohne dass irgendwo ein Fehler auftaucht.
      #
      # ⚠️ O-25/R0 (12.09.2026): die alte Version dieser Prüfung verlangte, dass
      # manifest.json die Zeichenkette "manifest.json" selbst enthält — die Datei
      # listet aber bewusst nur die ANDEREN 13 Bundle-Dateien, nicht sich selbst
      # (tools/onprem-manifest.mjs). Damit schlug dieser Schritt seit `6347071`
      # bei JEDEM Lauf fehl und kein calendar-api-Image wurde seither published.
      # Jetzt zwei getrennte, in beide Richtungen geprüfte Fragen:
      #   (a) Ist jede der 14 Bundle-Dateien wirklich im Image? (fängt O-57-Klasse)
      #   (b) Listet manifest.json genau die 13 ANDEREN Dateien — nicht mehr,
      #       nicht weniger? (die Rückrichtung — im Manifest gelistet, aber im
      #       Bundle fehlend — lief bisher NIE mit und lässt update.sh nachts
      #       auf einer Kundenbox scheitern)
      - name: Smoke test — onprem-Bundle ist im Image
        run: |
          set -e
          BUNDLE_DATEIEN="docker-compose.yml .env.template install.sh update.sh lib-health.sh manifest.json volumes/api/kong.yml volumes/api/kong-entrypoint.sh volumes/db/webhooks.sql volumes/db/no-pg-net.sql volumes/db/roles.sql volumes/db/jwt.sql volumes/db/realtime.sql volumes/db/_supabase.sql"

          docker create --name bundle-check calendar-api:smoke >/dev/null
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle
          docker cp bundle-check:/app/onprem-bundle/. /tmp/bundle/
          docker rm -f bundle-check >/dev/null

          # (a) jede Datei wirklich im Image?
          for datei in $BUNDLE_DATEIEN; do
            if [ ! -f "/tmp/bundle/$datei" ]; then
              echo "✗ im Bundle fehlend: $datei"
              exit 1
            fi
          done
          echo "✓ 14/14 Bundle-Dateien im Image vorhanden"

          # (b) manifest.json listet genau die 13 ANDEREN Dateien — beide Richtungen.
          for datei in $BUNDLE_DATEIEN; do
            [ "$datei" = "manifest.json" ] && continue
            if ! grep -q "\"$datei\"" /tmp/bundle/manifest.json; then
              echo "✗ manifest.json listet nicht: $datei"
              exit 1
            fi
          done
          erwartet=$(( $(echo $BUNDLE_DATEIEN | wc -w) - 1 ))
          gelistet=$(grep -oE '"yol"[[:space:]]*:[[:space:]]*"[^"]+"' /tmp/bundle/manifest.json | wc -l)
          if [ "$gelistet" -ne "$erwartet" ]; then
            echo "✗ manifest.json listet ${gelistet} Datei(en), erwartet ${erwartet} — überzählige/verwaiste Einträge"
            exit 1
          fi
          echo "✓ manifest.json listet genau ${erwartet}/${erwartet} Dateien, keine überzähligen"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api-backend
          file: ./api-backend/Dockerfile
          build-contexts: |
            onprem=./onprem
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
