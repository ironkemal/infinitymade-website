<!doctype html>
<meta charset="utf-8">
<title>Probe: Muster-13-Maske umziehen und Befunde ans Feld setzen</title>
<!--
  Diese Probe fasst die ECHTE Muster-13-Maske an, nicht eine nachgebaute.

  Sie holt `dashboard.html` per fetch, schneidet daraus `#rezeptModal` heraus
  und hängt es hier ein. Damit prüft sie genau das, was sonst niemand prüft:
  ob die Zuordnungstabelle in module/verordnung-feldmarker.js (Motor-Feldname →
  Element-ID → Ankerblock) noch zum Markup passt. Ein umbenanntes Kästchen oder
  eine entfernte `.m13-cell` fällt hier auf — sonst erst beim Anwender, als
  Befund, der nirgendwo erscheint.

  Kein Login, keine Datenbank: der Prüfmotor rechnet im Browser.
-->
<div id="buehne"></div>
<div id="seiten-host" style="border:1px dashed #888;padding:8px;"></div>

<script type="module">
const ergebnis = [];
const pruef = (name, ok, detail = '') => ergebnis.push({ name, ok: !!ok, detail: String(detail) });

try {
  // ── Die echte Maske aus dashboard.html holen ────────────────────────────
  const html = await (await fetch('../../dashboard.html')).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const modal = doc.getElementById('rezeptModal');
  pruef('dashboard.html enthält #rezeptModal', !!modal);
  document.getElementById('buehne').appendChild(document.importNode(modal, true));

  const wrap = document.getElementById('rzMaskeWrap');
  const heim = document.getElementById('rzMaskeHeim');
  pruef('#rzMaskeWrap steckt in #rzMaskeHeim', wrap && wrap.parentElement === heim);
  pruef('Speichern-Knopf zieht mit der Maske um',
    !!wrap?.querySelector('#rzSaveBtn'), 'rzSaveBtn muss INNERHALB von #rzMaskeWrap stehen');

  // ── Umzug in die Seite und zurück ───────────────────────────────────────
  const maske = await import('../../module/verordnung-maske.js?v=20260930b');
  const host = document.getElementById('seiten-host');
  host.appendChild(wrap);
  pruef('Umzug in die Seite', maske.istEingebettet());
  maske.maskeHeimschicken();
  pruef('Rückweg ins Modal', !maske.istEingebettet() && wrap.parentElement === heim);

  // QA 26.09.2026: aus der Liste geöffnet war die Maske ohne Klick-Verdrahtung
  // (Therapiebereich/Hausbesuch reagierten nicht), weil nur openRezeptModal()
  // wireM13Toggles() rief. Das Einbetten muss sie über die Brücke anstossen.
  let verdrahtet = 0;
  maske.setzeMaskeBruecke({ verdrahteToggles: () => { verdrahtet++; } });
  await maske.maskeEinbetten({ host, rx: { id: 'probe-rx', therapie_bereich: 'podo' } }).catch(e => pruef('Einbetten läuft', false, e?.message));
  pruef('Einbetten stösst die Klick-Verdrahtung an', verdrahtet === 1, verdrahtet);
  maske.maskeHeimschicken();
  maske.setzeMaskeBruecke(null);

  // ── Riegel ──────────────────────────────────────────────────────────────
  pruef('eingereichte Verordnung ist gesperrt (Belegnummer)',
    !!maske.schreibRiegel({ belegnummer: '7-3' }));
  pruef('eingereichte Verordnung ist gesperrt (Status)',
    !!maske.schreibRiegel({ abrechnung_status: 'gesendet' }));
  pruef('laufende Verordnung ist offen',
    maske.schreibRiegel({ abrechnung_status: null }) === null);

  // ── Jeder Motor-Feldname findet sein Kästchen ───────────────────────────
  const { markiereBefunde, loescheMarkierungen } = await import('../../module/verordnung-feldmarker.js?v=20260906');

  const FELDER = ['versichertennummer', 'kasseIk', 'ausstellungsdatum', 'behandlungsbeginn',
                  'arztLanr', 'arztBsnr', 'icd', 'diagnosegruppe', 'leitsymptomatik',
                  'heilmittel', 'heilmittelPosition', 'anzahl', 'frequenz'];

  for (const feld of FELDER) {
    loescheMarkierungen(document);
    const { gesetzt, ohneFeld } = markiereBefunde(
      [{ schwere: 'blocker', text: `Testbefund ${feld}`, feld, quelle: 'Probe' }], document);
    const markiert = document.querySelectorAll('.vo-mark-fehler').length;
    const kasten = document.querySelectorAll('[data-vo-hinweis]').length;
    pruef(`Feld „${feld}" wird gefunden und markiert`,
      gesetzt === 1 && ohneFeld.length === 0 && markiert >= 1 && kasten === 1,
      `gesetzt=${gesetzt} ohneFeld=${ohneFeld.length} markiert=${markiert} kasten=${kasten}`);
  }

  // ── Zwei Befunde auf denselben Block ergeben EINEN Kasten ────────────────
  loescheMarkierungen(document);
  markiereBefunde([
    { schwere: 'blocker', text: 'Heilmittel fehlt', feld: 'heilmittel', quelle: 'Probe' },
    { schwere: 'warnung', text: 'Position fehlt', feld: 'heilmittelPosition', quelle: 'Probe' },
  ], document);
  pruef('Heilmittel + Position teilen sich einen Hinweiskasten',
    document.querySelectorAll('[data-vo-hinweis]').length === 1,
    `${document.querySelectorAll('[data-vo-hinweis]').length} Kästen`);
  pruef('der schwerere Befund gewinnt die Umrandung',
    document.getElementById('rzHm').classList.contains('vo-mark-fehler'));

  // ── Aufräumen lässt nichts stehen ───────────────────────────────────────
  loescheMarkierungen(document);
  pruef('Löschen räumt Markierungen weg',
    document.querySelectorAll('.vo-mark-fehler, .vo-mark-warnung, [data-vo-hinweis]').length === 0);
  pruef('und gibt den ursprünglichen Tooltip zurück',
    !document.getElementById('rzHm').getAttribute('title'));

  // ── Hinweise bekommen keine Markierung, gehen aber nicht verloren ───────
  const nurHinweis = markiereBefunde(
    [{ schwere: 'hinweis', text: 'Frist läuft', feld: 'ausstellungsdatum' }], document);
  pruef('Hinweise werden nicht ans Feld gemalt',
    nurHinweis.gesetzt === 0 && nurHinweis.ohneFeld.length === 1);

  // ── Ein unbekanntes Feld verschwindet nicht still ───────────────────────
  const unbekannt = markiereBefunde(
    [{ schwere: 'blocker', text: 'x', feld: 'gibtEsNicht' }], document);
  pruef('unbekanntes Feld landet in ohneFeld statt im Nichts',
    unbekannt.gesetzt === 0 && unbekannt.ohneFeld.length === 1);

  // ── Der Prüfmotor liefert nur Feldnamen, die es hier gibt ───────────────
  const { pruefeVerordnung } = await import('../../module/verordnung-pruefung.js?v=20260930b');
  const leer = pruefeVerordnung({ rezeptart: 'gkv' }, { bereich: 'podologie', gruppen: {}, luecken: [] });
  const unbekannteFelder = [...new Set(leer.befunde
    .filter(b => b.schwere !== 'hinweis' && b.feld)
    .map(b => b.feld))].filter(f => !FELDER.includes(f));
  pruef('alle Pflichtbefunde zeigen auf ein Feld der Maske',
    unbekannteFelder.length === 0, unbekannteFelder.join(', '));

  // ── Zweiter ICD-Kode: Feld da, und er überlebt den Weg Maske → Nutzlast ─
  //
  // Bis zum 19.09.2026 gab es das Feld nicht. Der zweite Kode war damit von
  // Hand nicht erfassbar — und die §302-Datei bekommt je Kode ein eigenes
  // DIA-Segment, das also nie entstand. Diese Proben stehen hier, weil der
  // Weg nur mit echtem Markup prüfbar ist: `nutzlastAusMaske()` liest das DOM.
  // Als LETZTES, weil `fuelleMuster13` die Maske überschreibt.
  pruef('die Maske hat ein Feld für den zweiten ICD-Kode', !!document.getElementById('rzIcd2'));
  maske.fuelleMuster13({ icd10: 'E11.74', icd10_2: 'I70.24 – Atherosklerose' }, { alsVorlage: false });
  pruef('fuelleMuster13 schreibt den zweiten Kode in die Maske',
    document.getElementById('rzIcd2')?.value === 'I70.24 – Atherosklerose',
    document.getElementById('rzIcd2')?.value);
  const mitZwei = maske.nutzlastAusMaske({ icd10: 'E11.74' });
  pruef('nutzlastAusMaske gibt den zweiten Kode ohne Titel weiter',
    mitZwei.icd10_2 === 'I70.24', String(mitZwei.icd10_2));
  document.getElementById('rzIcd2').value = '';
  pruef('leeres Feld heisst null — der gelöschte Kode wird auch in der Spalte gelöscht',
    maske.nutzlastAusMaske({ icd10: 'E11.74' }).icd10_2 === null,
    String(maske.nutzlastAusMaske({ icd10: 'E11.74' }).icd10_2));

  // ── Abrechnung über (KHS M2.1): Umschalter in der echten Maske ──────────
  //
  // Eingeklappt, nicht versteckt: bei nicht-Kasse sind die GKV-Felder weg, aber
  // ihre Werte bleiben, und der Knopf holt sie zurück. Zurück auf Kasse = alles da.
  const um = await import('../../module/rezeptart-umschalter.js?v=20261006p');
  // Die Stilregeln stehen in dashboard.html, nicht im herausgeschnittenen Modal — mitnehmen,
  // und das Modal aufdecken, sonst ist alles „unsichtbar" und die Probe beweist nichts.
  for (const st of doc.querySelectorAll('style')) {
    if (st.textContent.includes('m13-gkv-zu')) { const n = document.createElement('style'); n.textContent = st.textContent; document.head.appendChild(n); }
  }
  const modalEl = document.getElementById('rezeptModal');
  modalEl.hidden = false; modalEl.removeAttribute('hidden'); modalEl.style.cssText = 'display:block;position:static;opacity:1;visibility:visible';
  const sichtbar = (id) => { const e = document.getElementById(id); return !!e && e.getClientRects().length > 0; };
  maske.fuelleMuster13({ diagnosegruppe: 'DF', rezeptart: 'kassen' }, { alsVorlage: false });
  pruef('Leiste hat vier Arten', document.querySelectorAll('#rzArtLeiste [data-art]').length === 4);
  pruef('Kasse: Diagnosegruppe + Krankenkasse sichtbar', sichtbar('rzDg') && sichtbar('rzPatKasse'));
  um.setzeArt(document, 'privat');
  pruef('Privat: GKV-Felder eingeklappt', !sichtbar('rzDg') && !sichtbar('rzPatKasse') && !sichtbar('rzPatVersNr'));
  pruef('Privat: Wert der Diagnosegruppe bleibt stehen', document.getElementById('rzDg').value === 'DF');
  pruef('Privat: Patientenname bleibt sichtbar', sichtbar('rzPatName'));
  pruef('Privat: Aufklapp-Knopf da', sichtbar('rzGkvToggle'));
  document.getElementById('rzGkvToggle').click();
  pruef('Aufklappen holt die GKV-Felder zurück', sichtbar('rzDg') && sichtbar('rzPatKasse'));
  um.setzeArt(document, 'kassen');
  pruef('Zurück auf Kasse: alles sichtbar, Knopf weg', sichtbar('rzDg') && !sichtbar('rzGkvToggle'));
  um.setzeArt(document, 'bg');
  pruef('nutzlastAusMaske schreibt rezeptart ausdrücklich',
    maske.nutzlastAusMaske({ icd10: 'E11.74' }).rezeptart === 'bg');
  um.setzeArt(document, 'kassen');
  pruef('Kasse wird als kassen geschrieben, nie gkv',
    maske.nutzlastAusMaske({ icd10: 'E11.74' }).rezeptart === 'kassen');
  // BG-Block (KHS M2.2): nur bei BG sichtbar, Werte reisen in der Nutzlast, bei anderer Art nicht
  um.setzeArt(document, 'kassen');
  pruef('BG-Block bei Kasse unsichtbar', !sichtbar('rzBgTraegerName'));
  um.setzeArt(document, 'bg');
  pruef('BG-Block bei BG sichtbar', sichtbar('rzBgTraegerName') && sichtbar('rzBgUnfalltag'));
  document.getElementById('rzBgTraegerName').value = ' BG Holz ';
  document.getElementById('rzBgUnfalltag').value = '2026-09-15';
  const nl = maske.nutzlastAusMaske({ icd10: 'E11.74' });
  pruef('Nutzlast trägt bg getrimmt', nl.bg?.traeger_name === 'BG Holz' && nl.bg?.unfalltag === '2026-09-15' && nl.bg?.aktenzeichen === null, JSON.stringify(nl.bg));
  pruef('Hinweise beim Speichern nennen Anschrift/Kostenzusage/Einverständnis',
    maske.bgHinweiseAusMaske().length === 3, maske.bgHinweiseAusMaske().join(' | '));
  um.setzeArt(document, 'privat');
  pruef('bei Privat kein bg in der Nutzlast, keine BG-Hinweise',
    maske.nutzlastAusMaske({ icd10: 'E11.74' }).bg === undefined && maske.bgHinweiseAusMaske().length === 0);
  maske.fuelleMuster13({ rezeptart: 'bg', bg_traeger_name: 'BG X', bg_unfalltag: '2026-09-15T00:00:00' }, { alsVorlage: false });
  pruef('fuelleMuster13 füllt die BG-Felder (Datum auf 10 Zeichen)',
    document.getElementById('rzBgTraegerName').value === 'BG X' && document.getElementById('rzBgUnfalltag').value === '2026-09-15');
  maske.fuelleMuster13({ rezeptart: 'bg', bg_traeger_name: 'BG X' }, { alsVorlage: true });
  pruef('Vorlage übernimmt keine BG-Angaben', document.getElementById('rzBgTraegerName').value === '');
  // F2 (Live-Test 06.10.): Behandlungsanlass/Nagel müssen beim ERSTEN Befüllen ankommen, auch wenn die
  // podologischen Felder noch nie angelegt wurden (sie entstehen sonst erst im nächsten Durchlauf).
  document.getElementById('rzPodoFelder')?.remove();
  maske.setzeMaskeBruecke({ setTherapiebereich: (k) => { document.getElementById('rzTherapieBereich').value = k || ''; } });
  maske.fuelleMuster13({ therapie_bereich: 'podo', rezeptart: 'privat', behandlungsanlass: 'QA-Test Anlass', nagel: 'U1 links' }, { alsVorlage: false });
  pruef('Behandlungsanlass ist beim ersten Befüllen da (Felder wurden vorher noch nie angelegt)',
    document.getElementById('rzPodoAnlass')?.value === 'QA-Test Anlass', String(document.getElementById('rzPodoAnlass')?.value));
  pruef('Nagel ebenso', document.getElementById('rzPodoNagel')?.value === 'U1 links' || !!document.getElementById('rzPodoNagel'), String(document.getElementById('rzPodoNagel')?.value));
  maske.setzeMaskeBruecke(null);

  // F1 (Live-Test 06.10.): Vorauswahl nach Patientenwahl — auch nachdem vorher von Hand geklickt wurde und die Maske neu geöffnet ist
  document.querySelector('#rzArtLeiste [data-art="bg"]').click();
  maske.maskeHeimschicken();
  maske.vorauswahlArtAusPatient({ insurance_type: 'privat' });
  pruef('Vorauswahl privat greift nach Neuöffnen (auch nach manuellem Klick davor)', document.getElementById('rzMaskeWrap').dataset.rezeptart === 'privat', document.getElementById('rzMaskeWrap').dataset.rezeptart);
  // N2-a (Nachtest): hin und zurück auf „Kasse" ist keine Wahl — die Vorauswahl greift trotzdem
  maske.maskeHeimschicken();
  document.querySelector('#rzArtLeiste [data-art="privat"]').click();
  document.querySelector('#rzArtLeiste [data-art="kassen"]').click();
  maske.vorauswahlArtAusPatient({ insurance_type: 'privat' });
  pruef('Vorauswahl greift auch nach Herumklicken, das bei Kasse endet', document.getElementById('rzMaskeWrap').dataset.rezeptart === 'privat');
  // aber eine bewusste Wahl (BG) bleibt
  document.querySelector('#rzArtLeiste [data-art="bg"]').click();
  maske.vorauswahlArtAusPatient({ insurance_type: 'privat' });
  pruef('Bewusst gewähltes BG wird nicht von der Vorauswahl überschrieben', document.getElementById('rzMaskeWrap').dataset.rezeptart === 'bg');
  maske.maskeHeimschicken();
  maske.vorauswahlArtAusPatient({ insurance_type: 'gkv' });
  pruef('gkv bleibt Kasse', document.getElementById('rzMaskeWrap').dataset.rezeptart === 'kassen');
  um.setzeSperre(document, { belegnummer: '7-3' });
  pruef('Sperre: andere Arten nicht wählbar, Hinweis steht da',
    document.querySelector('#rzArtLeiste [data-art="privat"]').disabled && sichtbar('rzArtHinweis'));
  um.setzeSperre(document, {});
  pruef('Ohne Sperre wieder wählbar', !document.querySelector('#rzArtLeiste [data-art="privat"]').disabled);

} catch (e) {
  pruef('Probe läuft durch', false, e?.stack || e?.message || String(e));
}

window.__probe = ergebnis;
</script>
