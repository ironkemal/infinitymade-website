<!doctype html>
<!-- Praxura Reel-Vorlage, 1080x1920. Deterministisch: window.renderAt(t) zeichnet den
     Zustand zur Sekunde t — keine CSS-Animationen, damit jedes Frame exakt reproduzierbar ist.
     Szenen kommen aus window.VIDEO (Tagesdatei sosyal/<jahr>/<MM-TT>.json, art "video").
     Szenentypen + Felder: siehe sosyal/SOSYAL-LOG.md → A6.
     Safe-Zone: Reels/TikTok verdecken unten ~420px und rechts ~150px → Text bleibt im Kasten. -->
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/system-fonts.css">
<style>
  :root{
    --bg:#F8F3E8; --bg-warm:#F1E9D6; --ink:#1A1611; --ink-soft:#4A4036; --ink-mute:#685E52;
    --bronze:#6B5538; --emerald:#1E3D2F; --gold:#C9A876; --rose:#9C3A3A;
    --serif:'Fraunces','Times New Roman',serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .bar{position:absolute;left:90px;right:90px;top:120px;height:6px;background:rgba(26,22,17,.08);border-radius:3px;z-index:9}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:3px;width:0}
  .scene{position:absolute;inset:0;padding:230px 150px 420px 90px;display:flex;flex-direction:column;justify-content:center;opacity:0;background:var(--bg)}
  .inhalt{display:flex;flex-direction:column}
  .kicker{font-family:var(--mono);font-size:34px;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze);margin-bottom:44px}
  .big{font-family:var(--serif);font-weight:400;font-size:150px;line-height:1;letter-spacing:-.035em}
  .mid{font-family:var(--serif);font-weight:400;font-size:112px;line-height:1.04;letter-spacing:-.03em}
  .big em,.mid em{font-style:italic;color:var(--bronze)}
  .w{display:inline-block;will-change:transform}
  .sub{font-size:46px;line-height:1.4;color:var(--ink-soft);margin-top:48px}
  .quelle{font-family:var(--mono);font-size:30px;color:var(--ink-mute);margin-top:40px;letter-spacing:.04em}

  /* dunkler Ton für jede Szene (ton: "dunkel") und Outro */
  .dunkel{background:var(--emerald);color:var(--bg)}
  .dunkel .big em,.dunkel .mid em{color:var(--gold)}
  .dunkel .kicker{color:var(--gold)}
  .dunkel .sub{color:rgba(248,243,232,.78)}
  .dunkel .quelle{color:rgba(248,243,232,.6)}

  /* hook: Verordnung + Stempel */
  .rezept{position:relative;margin-top:80px;width:780px;height:470px;background:#FFFEFB;border:2px solid rgba(26,22,17,.14);
    border-radius:10px;box-shadow:0 30px 60px rgba(26,22,17,.12);padding:44px 52px;color:var(--ink)}
  .rezept .kopf{font-family:var(--mono);font-size:26px;color:var(--ink-mute);letter-spacing:.1em;display:flex;justify-content:space-between}
  .rezept .z{height:20px;background:rgba(26,22,17,.08);border-radius:4px;margin-top:34px}
  .rezept .datum{font-family:var(--mono);font-size:30px;color:var(--ink);margin-top:40px}
  .stempel{position:absolute;right:40px;bottom:60px;padding:18px 40px;border:8px solid var(--rose);color:var(--rose);
    font-family:var(--mono);font-weight:700;font-size:74px;letter-spacing:.12em;border-radius:12px;opacity:0;transform-origin:center;white-space:nowrap}
  .stempel.gut{border-color:var(--emerald);color:var(--emerald)}

  /* zaehler */
  .zahl{font-family:var(--serif);font-size:420px;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
  .zahl small{font-size:120px;font-style:italic;color:var(--bronze);margin-right:24px;letter-spacing:-.02em}
  .dunkel .zahl small{color:var(--gold)}

  /* frage / vergleich: Karten */
  .karte{margin-top:56px;padding:48px 52px;border-radius:10px;opacity:0}
  .karte .lbl{font-family:var(--mono);font-size:28px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
  .karte p{font-size:52px;line-height:1.3}
  .karte p em{font-family:var(--serif);font-style:italic}
  .karte.hell{background:rgba(26,22,17,.06);color:var(--ink-mute)}
  .karte.hell.weg p{text-decoration:line-through;text-decoration-color:rgba(156,58,58,.7);text-decoration-thickness:3px}
  .karte.gruen{background:var(--emerald);color:var(--bg)} .karte.gruen .lbl{color:var(--gold)}
  .dunkel .karte.gruen{background:var(--bg);color:var(--ink)} .dunkel .karte.gruen .lbl{color:var(--bronze)}
  .dunkel .karte.hell{background:rgba(248,243,232,.1);color:rgba(248,243,232,.7)}

  /* countdown */
  .cd{position:relative;height:900px}
  .cd .punkt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0}
  .cd .nr{font-family:var(--serif);font-size:380px;line-height:.85;letter-spacing:-.05em;color:var(--bronze)}
  .dunkel .cd .nr{color:var(--gold)}
  .cd .txt{font-family:var(--serif);font-size:96px;line-height:1.06;letter-spacing:-.03em;margin-top:30px}
  .cd .txt em{font-style:italic;color:var(--bronze)} .dunkel .cd .txt em{color:var(--gold)}

  /* tippen */
  .cursor{display:inline-block;width:.06em;height:.9em;background:currentColor;margin-left:.06em;vertical-align:-.08em}

  /* figur: Therapeut:in als Figur, Laune + Requisit, Sprechblase */
  .figbox{position:relative;width:840px;height:836px;margin-top:30px}
  .figbox svg{position:absolute;left:0;top:0;width:660px;height:836px;overflow:visible}
  .blase{position:absolute;right:0;top:10px;max-width:400px;padding:30px 38px;background:#FFFEFB;color:var(--ink);
    border:4px solid var(--ink);border-radius:40px;font-size:46px;line-height:1.2;font-weight:600;opacity:0;transform-origin:20% 100%}
  .blase::after{content:"";position:absolute;left:46px;bottom:-30px;width:40px;height:40px;background:#FFFEFB;
    border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:skewY(30deg) rotate(30deg)}
  .blob{fill:var(--bg-warm)} .dunkel .blob{fill:rgba(248,243,232,.08)} .dunkel .zzz{fill:var(--gold)}
  .blase em{font-family:var(--serif);font-style:italic;color:var(--bronze);font-weight:500}

  /* geraet: Tablet mit Praxura-Oberfläche, Finger tippt */
  .geraet{position:relative;margin-top:56px;width:800px;padding:22px;background:var(--ink);border-radius:58px;box-shadow:0 40px 80px rgba(26,22,17,.25)}
  .screen{position:relative;height:800px;background:#FFFEFB;border-radius:38px;overflow:hidden;color:var(--ink)}
  .appbar{display:flex;justify-content:space-between;align-items:center;padding:30px 40px;border-bottom:2px solid rgba(26,22,17,.08)}
  .appbar .wm{font-family:var(--serif);font-size:44px;font-weight:500;letter-spacing:-.02em}
  .appbar .wm em{font-style:italic;color:var(--bronze)}
  .appbar .kopf{font-family:var(--mono);font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute)}
  .zeilen{padding:30px 34px;display:flex;flex-direction:column;gap:20px}
  .zeile{display:flex;align-items:center;gap:28px;padding:30px;border-radius:24px;background:rgba(26,22,17,.04);font-size:40px;color:var(--ink-mute)}
  .zeile.aktiv{background:rgba(201,168,118,.25);color:var(--ink)}
  .zeile.fertig{color:var(--ink)}
  .kreis{flex:none;width:64px;height:64px;border-radius:50%;border:4px solid rgba(26,22,17,.2);display:grid;place-items:center}
  .fertig .kreis{background:var(--emerald);border-color:var(--emerald)}
  .kreis svg{width:36px;height:36px;opacity:0}
  .toast{position:absolute;left:34px;right:34px;bottom:34px;padding:30px 36px;border-radius:24px;background:var(--emerald);color:var(--bg);
    font-size:40px;font-weight:600;display:flex;gap:22px;align-items:center;opacity:0;z-index:3}
  .toast svg{flex:none;width:44px;height:44px}
  .finger,.ring{position:absolute;left:0;top:0;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;opacity:0;z-index:5}
  .finger{background:rgba(26,22,17,.22);border:5px solid rgba(255,255,255,.95);box-shadow:0 8px 24px rgba(26,22,17,.25)}
  .ring{border:5px solid var(--gold);z-index:4}
  .kal{display:grid;grid-template-columns:96px repeat(5,1fr);gap:10px;padding:26px 30px}
  .kal .tg{font-family:var(--mono);font-size:26px;color:var(--ink-mute);text-align:center;letter-spacing:.08em;padding-bottom:6px}
  .kal .uhr{font-family:var(--mono);font-size:26px;color:var(--ink-mute);display:flex;align-items:center}
  .kal .zelle{position:relative;height:84px;background:rgba(26,22,17,.035);border-radius:14px}
  .kal .blk{position:absolute;inset:5px;border-radius:11px;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .kal .belegt{background:rgba(107,85,56,.16)}
  .kal .serie{background:var(--emerald);color:var(--bg);opacity:0}
  .fusswrap{position:relative;width:420px;height:440px;margin:22px auto 0}
  .fusswrap svg{position:absolute;inset:0;width:100%;height:100%}
  .ziel{position:absolute;width:2px;height:2px}
  .chips{display:flex;flex-wrap:wrap;gap:14px;padding:16px 34px 0;justify-content:center}
  .chip{font-size:32px;font-weight:600;padding:12px 24px;border-radius:40px;background:rgba(156,58,58,.1);color:var(--rose);opacity:0}

  /* outro */
  .marke{font-family:var(--serif);font-weight:500;font-size:96px;letter-spacing:-.02em;margin-top:120px}
  .marke em{font-style:italic;color:var(--gold)}
  .cta{font-family:var(--mono);font-size:34px;letter-spacing:.1em;color:rgba(248,243,232,.7);margin-top:24px;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage"><div class="bar"><i></i></div></div>
<script>
const V = window.VIDEO;
const stage = document.getElementById('stage');
const barFill = stage.querySelector('.bar i');
const clamp = x => Math.min(1, Math.max(0, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  back: x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
  in: x => x * x * x,
};
// Wörter einzeln umschließen, <em> bleibt erhalten
const words = html => html.replace(/(<em>.*?<\/em>|[^\s<]+)/g, m => `<span class="w">${m}</span>`);
const plain = html => html.replace(/<[^>]+>/g, '').replace(/&shy;/g, '');

// ── Figur ──────────────────────────────────────────────────────────────────────
// Halbfigur im viewBox 600x760, Kopfmitte (300,250). person 0–3 = Haut/Haar/Shirt-Voreinstellung.
const HAUT = ['#E9BC9C', '#C98E68', '#F3D3BA', '#8E5B3D'];
const HAAR = ['#3B2A20', '#1F1A17', '#A0703F', '#2A1E18'];
const SHIRT = ['#1E3D2F', '#2E5A47', '#6B5538', '#1E3D2F'];
const SCHULTER = [[168, 462], [432, 462]];
// [Ellbogen L, Hand L, Ellbogen R, Hand R]
const POSEN = {
  unten: [[120, 610], [150, 735], [480, 610], [450, 735]],
  tablet: [[108, 650], [178, 612], [492, 650], [422, 612]],
  kaffee: [[120, 610], [150, 735], [515, 600], [440, 508]],
  kopf: [[66, 480], [176, 300], [534, 480], [424, 300]],
  winken: [[120, 610], [150, 735], [548, 420], [520, 262]],
};
const POSE_VON = { zettel: 'kopf', tablet: 'tablet', kaffee: 'kaffee', keine: 'unten', winken: 'winken' };
const MUND = {
  entspannt: ['M266,306 Q300,350 334,306 Z', '#5B2620', 'none'],
  neutral: ['M278,314 Q300,326 322,314', 'none', 'var(--ink)'],
  gestresst: ['M270,322 Q285,308 300,322 Q315,336 330,322', 'none', 'var(--ink)'],
  schlaf: ['M292,318 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0', '#5B2620', 'none'],
};
const HAKEN = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#F8F3E8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function haar(n) {
  if (n === 1) { // Locken
    const k = Array.from({ length: 11 }, (_, i) => {
      const a = Math.PI * (1.02 + i * .096);
      return `<circle cx="${300 + Math.cos(a) * 112}" cy="${232 + Math.sin(a) * 112}" r="40"/>`;
    }).join('');
    return ['', `${k}<path d="M196,236 Q200,150 300,146 Q400,150 404,236 Q360,196 300,196 Q240,196 196,236Z"/>`];
  }
  if (n === 2) return ['', '<path d="M180,250 Q178,120 300,118 Q420,120 420,240 Q395,170 320,166 Q280,196 220,190 Q190,210 180,250Z"/>'];
  if (n === 3) return ['<path d="M168,270 Q150,108 300,110 Q450,108 432,270 L452,470 Q300,500 148,470Z"/>',
    '<path d="M182,240 Q182,128 300,124 Q418,128 418,240 Q370,160 300,200 Q236,160 182,240Z"/>'];
  return ['', '<circle cx="300" cy="126" r="48"/><path d="M180,262 Q172,118 300,116 Q428,118 420,262 Q404,186 300,178 Q206,182 180,262Z"/>'];
}

function figurSVG(s) {
  const p = (s.person ?? 0) % 4, hautF = HAUT[p], haarF = HAAR[p], shirt = SHIRT[p];
  const [hinten, vorne] = haar(p);
  const arm = c => `<path class="arm${c}a" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="66" stroke-linecap="round"/>
    <path class="arm${c}b" fill="none" stroke="${shirt}" stroke-width="54" stroke-linecap="round"/>`;
  const blatt = Array.from({ length: 6 }, () => `<g class="blatt"><rect width="80" height="104" rx="6" fill="#FFFEFB" stroke="rgba(26,22,17,.25)" stroke-width="3"/>
    <rect x="14" y="20" width="52" height="6" rx="3" fill="rgba(26,22,17,.2)"/><rect x="14" y="38" width="40" height="6" rx="3" fill="rgba(26,22,17,.2)"/>
    <rect x="14" y="56" width="48" height="6" rx="3" fill="rgba(26,22,17,.2)"/><rect x="14" y="74" width="30" height="6" rx="3" fill="rgba(156,58,58,.45)"/></g>`).join('');
  const stern = 'M0,-18 L4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4Z';
  return `<svg viewBox="0 0 600 760"><g class="ganz">
    <circle class="blob" cx="300" cy="420" r="290"/>
    <g class="kopfmit" fill="${haarF}">${hinten}</g>
    <rect x="266" y="330" width="68" height="110" rx="30" fill="${hautF}"/>
    <path d="M96,760 L96,530 Q96,432 196,416 L404,416 Q504,432 504,530 L504,760 Z" fill="${shirt}"/>
    <path d="M262,416 L300,474 L338,416 Z" fill="${hautF}"/>
    <rect x="372" y="520" width="64" height="34" rx="7" fill="var(--gold)"/>
    ${arm('l')}${arm('r')}
    <g class="kopfmit">
      <circle cx="182" cy="262" r="24" fill="${hautF}"/><circle cx="418" cy="262" r="24" fill="${hautF}"/>
      <ellipse cx="300" cy="252" rx="120" ry="130" fill="${hautF}"/>
      <circle class="wange" cx="232" cy="302" r="20" fill="#E07F6C"/><circle class="wange" cx="368" cy="302" r="20" fill="#E07F6C"/>
      <ellipse class="auge" cx="255" cy="258" rx="13" ry="17" fill="var(--ink)"/><ellipse class="auge" cx="345" cy="258" rx="13" ry="17" fill="var(--ink)"/>
      <path class="zu" d="M240,260 Q255,272 270,260 M330,260 Q345,272 360,260" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
      <path class="braue" d="M233,214 L277,214" stroke="${haarF}" stroke-width="10" stroke-linecap="round"/>
      <path class="braue" d="M323,214 L367,214" stroke="${haarF}" stroke-width="10" stroke-linecap="round"/>
      <path d="M300,266 Q290,290 306,292" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="6" stroke-linecap="round"/>
      <path class="mund" stroke-width="7" stroke-linecap="round"/>
      <g fill="${haarF}">${vorne}</g>
      ${p === 2 ? '<g fill="none" stroke="var(--ink)" stroke-width="6"><rect x="222" y="230" width="66" height="54" rx="18"/><rect x="312" y="230" width="66" height="54" rx="18"/><path d="M288,252 Q300,244 312,252"/></g>' : ''}
      <path class="schweiss" d="M0,-22 Q14,0 10,10 A10,10 0 1,1 -10,10 Q-14,0 0,-22Z" fill="#8EC5E8"/>
    </g>
    <g class="tablet"><rect x="160" y="530" width="280" height="180" rx="22" fill="var(--ink)"/>
      <rect x="174" y="544" width="252" height="152" rx="12" fill="#FFFEFB"/>
      ${[0, 1, 2].map(i => `<rect x="214" y="${562 + i * 44}" width="${150 - i * 24}" height="14" rx="7" fill="rgba(26,22,17,.18)"/>
        <g class="tcheck" transform="translate(195 ${569 + i * 44})"><circle r="13" fill="var(--emerald)"/>
        <path d="M-6,0 L-1,5 L7,-5" fill="none" stroke="#F8F3E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>`).join('')}</g>
    <g class="tasse"><g class="dampf" fill="none" stroke="rgba(104,94,82,.5)" stroke-width="6" stroke-linecap="round">
      <path d="M422,410 q-10,-16 0,-32 q10,-16 0,-32"/><path d="M446,404 q-10,-16 0,-32 q10,-16 0,-32"/><path d="M470,410 q-10,-16 0,-32 q10,-16 0,-32"/></g>
      <path d="M494,440 q34,0 34,26 q0,26 -34,26" fill="none" stroke="#FFFEFB" stroke-width="12"/>
      <rect x="402" y="420" width="96" height="104" rx="14" fill="#FFFEFB" stroke="rgba(26,22,17,.2)" stroke-width="3"/>
      <rect x="402" y="452" width="96" height="16" fill="var(--gold)"/></g>
    <circle class="hand" r="36" fill="${hautF}"/><circle class="hand" r="36" fill="${hautF}"/>
    <g class="zzz" font-family="var(--serif)" font-style="italic" fill="var(--bronze)">
      <text font-size="64">Z</text><text font-size="48">z</text><text font-size="36">z</text></g>
    ${[[470, 130], [128, 170], [500, 330]].map(([x, y]) => `<path class="stern" data-x="${x}" data-y="${y}" d="${stern}" fill="var(--gold)"/>`).join('')}
    ${blatt}
  </g></svg>`;
}

function figurRender(z, lt, erste) {
  const s = z.s, w = s.wechsel, f = z.fig;
  const nach = !!w && lt >= w.bei;
  const st = nach ? { ...s, ...w } : s;
  const laune = st.laune || 'neutral', req = st.requisit || 'keine';
  const pa = POSEN[s.pose || POSE_VON[s.requisit || 'keine']];
  let pose = pa;
  if (w) {
    const pb = POSEN[w.pose || POSE_VON[st.requisit || 'keine']];
    const p = E.out(prog(lt, w.bei, w.bei + .35));
    pose = pa.map((q, i) => [q[0] + (pb[i][0] - q[0]) * p, q[1] + (pb[i][1] - q[1]) * p]);
  }
  pose = pose.map(q => [...q]);
  if ((w && nach ? w.pose : s.pose) === 'winken' || (!s.pose && req === 'winken')) pose[3][0] += Math.sin(lt * 9) * 24;

  // Ganze Figur: atmen, Auftritt von unten (nicht in Szene 1)
  const auf = erste ? 1 : E.out(prog(lt, 0, .4));
  f.ganz.setAttribute('transform', `translate(0 ${Math.sin(lt * 1.8) * 3 + (1 - auf) * 90})`);
  // Arme + Hände
  [0, 1].forEach(i => {
    const [sx, sy] = SCHULTER[i], [ex, ey] = pose[i * 2], [hx, hy] = pose[i * 2 + 1];
    const d = `M${sx},${sy} Q${ex},${ey} ${hx},${hy}`;
    f.arme[i * 2].setAttribute('d', d); f.arme[i * 2 + 1].setAttribute('d', d);
    f.haende[i].setAttribute('cx', hx); f.haende[i].setAttribute('cy', hy);
  });
  // Kopf: wippen, bei Stress zittern, beim Wechsel kurz "ploppen"
  const pop = nach ? 1 + .07 * (1 - E.out(prog(lt, w.bei, w.bei + .3))) : 1;
  const zitt = laune === 'gestresst' ? Math.sin(lt * 16) * 3 : 0;
  const kt = `translate(${zitt} ${Math.sin(lt * 2.2) * 4}) translate(300 250) scale(${pop}) translate(-300 -250)`;
  f.kopf.forEach(g => g.setAttribute('transform', kt));
  // Gesicht
  const zwinker = (lt % 2.6) > 1.9 && (lt % 2.6) < 2.02;
  f.augen.forEach(a => { a.setAttribute('ry', zwinker ? 2 : 17); a.style.opacity = laune === 'schlaf' ? 0 : 1; });
  f.zu.style.opacity = laune === 'schlaf' ? 1 : 0;
  const bw = laune === 'gestresst' ? 14 : laune === 'entspannt' ? -6 : 0;
  f.brauen[0].setAttribute('transform', `rotate(${-bw} 255 214) translate(0 ${laune === 'entspannt' ? -6 : 0})`);
  f.brauen[1].setAttribute('transform', `rotate(${bw} 345 214) translate(0 ${laune === 'entspannt' ? -6 : 0})`);
  const [md, mf, ms] = MUND[laune] || MUND.neutral;
  f.mund.setAttribute('d', md); f.mund.setAttribute('fill', mf); f.mund.setAttribute('stroke', ms);
  f.wangen.forEach(c => c.style.opacity = laune === 'entspannt' ? .5 : laune === 'schlaf' ? .3 : .12);
  const tr = (lt * 1.4) % 1;
  f.schweiss.style.opacity = laune === 'gestresst' ? 1 - tr : 0;
  f.schweiss.setAttribute('transform', `translate(428 ${170 + tr * 70})`);
  // Requisiten: Einblenden zum Wechsel (oder zu Szenenbeginn)
  const zeigAb = r => (nach && s.requisit !== r ? w.bei + .15 : erste ? 0 : .2);
  const tabK = req === 'tablet' ? E.back(prog(lt, zeigAb('tablet'), zeigAb('tablet') + .3)) : 0;
  f.tablet.style.opacity = tabK > 0 ? 1 : 0;
  f.tablet.setAttribute('transform', `translate(300 620) scale(${tabK}) translate(-300 -620)`);
  f.tchecks.forEach((c, i) => {
    const k = E.back(prog(lt, zeigAb('tablet') + .45 + i * .3, zeigAb('tablet') + .7 + i * .3));
    c.style.opacity = k > 0 ? 1 : 0;
    c.setAttribute('transform', `translate(195 ${569 + i * 44}) scale(${k})`);
  });
  const tasK = req === 'kaffee' ? E.back(prog(lt, zeigAb('kaffee'), zeigAb('kaffee') + .3)) : 0;
  f.tasse.style.opacity = tasK > 0 ? 1 : 0;
  f.tasse.setAttribute('transform', `translate(450 520) scale(${tasK}) translate(-450 -520)`);
  f.dampf.forEach((d, i) => {
    const q = (lt * .9 + i * .33) % 1;
    d.setAttribute('transform', `translate(0 ${-q * 40})`); d.style.opacity = Math.sin(q * Math.PI);
  });
  // Zettel kreisen um den Kopf; beim Wechsel fliegen sie weg
  const zettelDa = s.requisit === 'zettel';
  const weg = nach && st.requisit !== 'zettel' ? prog(lt, w.bei, w.bei + .5) : 0;
  f.blaetter.forEach((b, i) => {
    if (!zettelDa || weg >= 1) { b.style.opacity = 0; return; }
    const a = i * 1.047 + lt * 1.3, r = (235 + 18 * Math.sin(lt * 3 + i)) * (1 + weg * 2.2);
    const x = 300 + Math.cos(a) * r, y = 270 + Math.sin(a) * r * .78;
    b.style.opacity = 1 - weg;
    b.setAttribute('transform', `translate(${x} ${y}) rotate(${(a * 57 + lt * 90 * (i % 2 ? 1 : -1)) % 360}) translate(-40 -52)`);
  });
  // Schlaf: Zzz steigen; entspannt: Sterne funkeln
  f.zzz.style.opacity = laune === 'schlaf' ? 1 : 0;
  [...f.zzz.children].forEach((t, i) => {
    const q = (lt * .7 + i * .33) % 1;
    t.setAttribute('x', 410 + i * 40 + q * 20); t.setAttribute('y', 190 - i * 50 - q * 60);
    t.style.opacity = Math.sin(q * Math.PI);
  });
  f.sterne.forEach((p, i) => {
    const k = laune === 'entspannt' ? Math.max(0, Math.sin(lt * 4 + i * 2.1)) : 0;
    p.setAttribute('transform', `translate(${p.dataset.x} ${p.dataset.y}) scale(${k})`);
  });
  // Sprechblase: erscheint, beim Wechsel neuer Text mit neuem Plopp
  const text = st.sprechblase || '';
  if (f.blase.dataset.t !== text) { f.blase.innerHTML = text; f.blase.dataset.t = text; }
  const b0 = nach ? w.bei + .25 : erste ? .15 : .45;
  const bk = text ? E.back(prog(lt, b0, b0 + .3)) : 0;
  f.blase.style.opacity = clamp(bk * 1.5);
  f.blase.style.transform = `scale(${.4 + .6 * bk})`;
}

// ── Gerät ──────────────────────────────────────────────────────────────────────
const FUSS_SOHLE = 'M105,70 C160,70 182,120 178,190 C174,250 160,290 160,340 C160,395 135,425 100,425 C65,425 45,395 48,340 C52,285 30,240 28,180 C26,115 55,70 105,70Z';
const ZEHEN = [[62, 48, 28], [112, 36, 19], [146, 42, 17], [172, 58, 15], [190, 82, 13]];
const FUSS_PUNKTE = [[302, 88], [110, 196], [344, 412], [32, 124]];
function fuss(spiegel) {
  const zehen = ZEHEN.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
  return `<g transform="${spiegel ? 'translate(220 40) scale(-1 1)' : 'translate(240 40)'}" fill="rgba(201,168,118,.22)" stroke="var(--bronze)" stroke-width="4">
    <path d="${FUSS_SOHLE}"/>${zehen}</g>`;
}
function geraetHTML(s) {
  const ans = s.ansicht || 'schritte';
  let body = '';
  if (ans === 'kalender') {
    const tage = ['Mo', 'Di', 'Mi', 'Do', 'Fr'], belegt = new Set(['0-0', '1-1', '3-0', '2-3', '4-4', '0-3', '4-1', '1-4', '3-3']);
    const zeile = s.serieZeile ?? 2;
    body = `<div class="kal"><span></span>${tage.map(t => `<span class="tg">${t}</span>`).join('')}
      ${[8, 9, 10, 11, 12].map((h, r) => `<span class="uhr">${h}:00</span>${tage.map((_, c) =>
        `<div class="zelle" data-r="${r}" data-c="${c}">${r === zeile ? `<div class="blk serie">${s.serieLabel || 'Serie'}</div>`
          : belegt.has(`${c}-${r}`) ? '<div class="blk belegt"></div>' : ''}</div>`).join('')}`).join('')}</div>`;
  } else if (ans === 'fuss') {
    const pk = (s.punkte || []).slice(0, 4);
    body = `<div class="fusswrap"><svg viewBox="0 0 460 480">${fuss(true)}${fuss(false)}
      ${pk.map((_, i) => `<g class="mark" transform="translate(${FUSS_PUNKTE[i].join(' ')})"><circle class="mring" r="16" fill="none" stroke="var(--rose)" stroke-width="4"/>
        <circle r="16" fill="var(--rose)" stroke="#FFFEFB" stroke-width="5"/></g>`).join('')}</svg>
      ${pk.map((_, i) => `<i class="ziel" style="left:${FUSS_PUNKTE[i][0] / 4.6}%;top:${FUSS_PUNKTE[i][1] / 4.8}%"></i>`).join('')}</div>
      <div class="chips">${pk.map(p => `<span class="chip">${p}</span>`).join('')}</div>`;
  } else {
    body = `<div class="zeilen">${(s.schritte || []).map(x => `<div class="zeile"><span class="kreis">${HAKEN}</span><span>${x}</span></div>`).join('')}</div>`;
  }
  return `<div class="geraet"><div class="screen">
    <div class="appbar"><span class="wm">Prax<em>ura</em></span><span class="kopf">${s.kopf || ''}</span></div>
    ${body}${s.ergebnis ? `<div class="toast">${HAKEN}<span>${s.ergebnis}</span></div>` : ''}
    <div class="ring"></div><div class="finger"></div></div></div>`;
}
const relPos = (el, root) => {
  let x = el.offsetWidth / 2, y = el.offsetHeight / 2;
  while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
  return [x, y];
};

function geraetRender(z, lt) {
  const s = z.s, el = z.el, scr = el.querySelector('.screen');
  const ans = s.ansicht || 'schritte';
  const ziele = ans === 'kalender' ? [el.querySelector(`.zelle[data-r="${s.serieZeile ?? 2}"][data-c="0"]`)]
    : ans === 'fuss' ? [...el.querySelectorAll('.ziel')] : [...el.querySelectorAll('.zeile')];
  const n = ziele.length, t0 = .75;
  const t1 = ans === 'kalender' ? t0 : Math.max(t0, s.dauer - 1.3);
  const T = i => (n <= 1 ? t0 : t0 + (t1 - t0) * i / (n - 1));
  const P = ziele.map(e => relPos(e, scr));
  // Finger: von unten rechts herein, dann von Ziel zu Ziel
  const start = [scr.offsetWidth * .85, scr.offsetHeight + 80];
  let pos = P[n - 1] || start;
  for (let i = 0; i < n; i++) {
    if (lt < T(i)) {
      const von = i === 0 ? start : P[i - 1], m = E.out(prog(lt, T(i) - .45, T(i) - .08));
      pos = [von[0] + (P[i][0] - von[0]) * m, von[1] + (P[i][1] - von[1]) * m];
      break;
    }
  }
  const fin = el.querySelector('.finger'), ring = el.querySelector('.ring');
  let tipp = -1;
  for (let i = 0; i < n; i++) if (lt >= T(i) && lt < T(i) + .45) tipp = i;
  const q = tipp >= 0 ? prog(lt, T(tipp), T(tipp) + .45) : 1;
  const druck = tipp >= 0 ? 1 - .18 * Math.sin(Math.min(1, q * 1.8) * Math.PI) : 1;
  fin.style.opacity = prog(lt, t0 - .6, t0 - .4) * (1 - prog(lt, T(n - 1) + .5, T(n - 1) + .8));
  fin.style.transform = `translate(${pos[0]}px, ${pos[1]}px) scale(${druck})`;
  ring.style.opacity = tipp >= 0 ? 1 - q : 0;
  ring.style.transform = `translate(${pos[0]}px, ${pos[1]}px) scale(${1 + q * 1.4})`;
  let fertigBei = T(n - 1) + .2;
  if (ans === 'schritte') {
    el.querySelectorAll('.zeile').forEach((r, i) => {
      r.classList.toggle('aktiv', lt >= T(i) - .45 && lt < T(i) + .08);
      r.classList.toggle('fertig', lt >= T(i) + .08);
      const k = E.back(prog(lt, T(i) + .08, T(i) + .35));
      const h = r.querySelector('.kreis svg'); h.style.opacity = k > 0 ? 1 : 0; h.style.transform = `scale(${k})`;
    });
  } else if (ans === 'kalender') {
    const blk = el.querySelectorAll('.serie');
    blk.forEach((b, i) => {
      const k = E.back(prog(lt, t0 + .1 + i * .18, t0 + .4 + i * .18));
      b.style.opacity = clamp(k * 1.5); b.style.transform = `translateY(${(1 - k) * -40}px) scale(${.6 + .4 * k})`;
    });
    fertigBei = t0 + .1 + blk.length * .18 + .2;
  } else if (ans === 'fuss') {
    el.querySelectorAll('.mark').forEach((m, i) => {
      const k = E.back(prog(lt, T(i) + .05, T(i) + .3));
      m.style.opacity = k > 0 ? 1 : 0;
      m.setAttribute('transform', `translate(${FUSS_PUNKTE[i].join(' ')}) scale(${k})`);
      const pr = ((lt - T(i)) % 1.2) / 1.2, ri = m.querySelector('.mring');
      ri.setAttribute('r', 16 + pr * 22); ri.style.opacity = lt > T(i) ? 1 - pr : 0;
    });
    el.querySelectorAll('.chip').forEach((c, i) => {
      const k = E.back(prog(lt, T(i) + .12, T(i) + .4));
      c.style.opacity = clamp(k * 1.5); c.style.transform = `translateY(${(1 - k) * 30}px)`;
    });
  }
  const toast = el.querySelector('.toast');
  if (toast) {
    const k = E.back(prog(lt, fertigBei + .25, fertigBei + .6));
    toast.style.opacity = clamp(k * 1.5); toast.style.transform = `translateY(${(1 - k) * 140}px)`;
  }
}

let start = 0;
const szenen = V.szenen.map(s => {
  const el = document.createElement('div');
  const dunkel = s.typ === 'outro' || s.ton === 'dunkel';
  el.className = 'scene' + (dunkel ? ' dunkel' : '');
  const k = s.kicker ? `<div class="kicker">${s.kicker}</div>` : '';
  const q = s.quelle ? `<div class="quelle">${s.quelle}</div>` : '';
  let html = '';
  if (s.typ === 'hook') {
    html = `${k}<div class="big">${words(s.titel)}</div>
      <div class="rezept"><div class="kopf"><span>${s.kopf || 'VERORDNUNG · HEILMITTEL'}</span><span>${s.muster || ''}</span></div>
      <div class="z" style="width:80%"></div><div class="z" style="width:60%"></div><div class="z" style="width:70%"></div>
      <div class="datum">${s.datum || ''}</div><div class="stempel ${s.stempelGut ? 'gut' : ''}">${s.stempel}</div></div>`;
  } else if (s.typ === 'zaehler') {
    html = `${k}<div class="zahl"><small>${s.praefix || ''}</small><span class="n">${s.von}</span></div>
      <div class="sub">${s.text || ''}</div>${q}`;
  } else if (s.typ === 'frage') {
    html = `${k}<div class="mid">${words(s.titel)}</div>
      <div class="karte gruen"><div class="lbl">${s.antwortLabel || 'Antwort'}</div><p>${s.antwort}</p></div>${q}`;
  } else if (s.typ === 'vergleich') {
    html = `${k}${s.titel ? `<div class="mid" style="font-size:88px">${words(s.titel)}</div>` : ''}
      <div class="karte hell ${s.links.weg === false ? '' : 'weg'}"><div class="lbl">${s.links.label}</div><p>${s.links.text}</p></div>
      <div class="karte gruen"><div class="lbl">${s.rechts.label}</div><p>${s.rechts.text}</p></div>${q}`;
  } else if (s.typ === 'countdown') {
    const n = s.punkte.length;
    html = `${k}<div class="cd">${s.punkte.map((p, i) =>
      `<div class="punkt"><div class="nr">${n - i}</div><div class="txt">${p}</div></div>`).join('')}</div>`;
  } else if (s.typ === 'enthuellung') {
    html = `${k}<div class="mid enth">${s.titel}</div>${s.text ? `<div class="sub">${s.text}</div>` : ''}`;
  } else if (s.typ === 'tippen') {
    html = `${k}<div class="mid"><span class="tipp"></span><span class="cursor"></span></div>${s.text ? `<div class="sub">${s.text}</div>` : ''}`;
  } else if (s.typ === 'figur') {
    html = `${k}<div class="mid" style="font-size:92px">${words(s.titel)}</div>
      <div class="figbox">${figurSVG(s)}<div class="blase"></div></div>`;
  } else if (s.typ === 'geraet') {
    html = `${k}<div class="mid" style="font-size:92px">${words(s.titel)}</div>${geraetHTML(s)}`;
  } else if (s.typ === 'outro') {
    html = `${k}<div class="mid">${words(s.titel)}</div>
      <div class="marke">Prax<em>ura</em></div><div class="cta">${s.cta || ''}</div>`;
  } else { // aussage
    html = `${k}<div class="mid">${words(s.titel)}</div>${s.text ? `<div class="sub">${s.text}</div>` : ''}${q}`;
  }
  el.innerHTML = `<div class="inhalt">${html}</div>`;
  stage.appendChild(el);
  const seg = { s, el, a: start, b: start + s.dauer, ws: [...el.querySelectorAll('.w')],
    tippText: s.typ === 'tippen' ? plain(s.titel) : '' };
  if (s.typ === 'figur') {
    const q = c => [...el.querySelectorAll(c)];
    seg.fig = { ganz: el.querySelector('.ganz'), kopf: q('.kopfmit'), arme: q('.armla,.armlb,.armra,.armrb'),
      haende: q('.hand'), augen: q('.auge'), zu: el.querySelector('.zu'), brauen: q('.braue'), mund: el.querySelector('.mund'),
      wangen: q('.wange'), schweiss: el.querySelector('.schweiss'), tablet: el.querySelector('.tablet'), tchecks: q('.tcheck'),
      tasse: el.querySelector('.tasse'), dampf: q('.dampf path'), blaetter: q('.blatt'), zzz: el.querySelector('.zzz'),
      sterne: q('.stern'), blase: el.querySelector('.blase') };
  }
  start += s.dauer;
  return seg;
});
window.DAUER = start;
// Mitte/Ende jeder Szene — für die Vorschau (ein Frame pro Szene, alles sichtbar)
window.SZENEN_ENDE = szenen.map(z => Math.max(z.a, z.b - .35));

// Überlaufprüfung: Inhalt darf weder unten noch rechts aus der Safe-Zone ragen
window.pruefe = () => {
  const fehler = [];
  szenen.forEach((z, i) => {
    z.el.style.opacity = 1; z.el.style.transform = 'none';
    if (z.s.typ === 'countdown') z.el.querySelectorAll('.punkt').forEach(p => { p.style.opacity = 1; p.querySelector('.nr').style.transform = 'none'; });
    if (z.s.typ === 'tippen') z.el.querySelector('.tipp').textContent = z.tippText;
    if (z.s.typ === 'hook') z.el.querySelector('.stempel').style.transform = 'rotate(-12deg)';
    const inhalt = z.el.querySelector('.inhalt').getBoundingClientRect();
    if (inhalt.top < 225 || inhalt.bottom > 1920 - 415) fehler.push(`Szene ${i + 1} (${z.s.typ}): zu hoch (${Math.round(inhalt.height)} px, max 1270)`);
    z.el.querySelectorAll('.inhalt *').forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.width && r.right > 1080 - 145) fehler.push(`Szene ${i + 1} (${z.s.typ}): ragt rechts raus: "${n.textContent.trim().slice(0, 40)}"`);
    });
    z.el.style.opacity = 0;
  });
  return [...new Set(fehler)];
};

window.renderAt = t => {
  barFill.style.width = (prog(t, 0, start) * 100) + '%';
  szenen.forEach((z, i) => {
    const lt = t - z.a;
    const aktiv = t >= z.a && t < z.b || (i === szenen.length - 1 && t >= z.b);
    if (!aktiv) { z.el.style.opacity = 0; return; }
    const ersteSzene = i === 0;
    const schnitt = z.s.uebergang === 'schnitt';
    // Auftritt: schneller Schub von unten. Szene 1 steht ab Frame 0 (Vorschaubild muss packen).
    const ein = ersteSzene || schnitt ? 1 : E.out(prog(lt, 0, .28));
    const naechsteSchnitt = szenen[i + 1] && szenen[i + 1].s.uebergang === 'schnitt';
    const aus = i < szenen.length - 1 && !naechsteSchnitt ? 1 - prog(lt, z.s.dauer - .15, z.s.dauer) : 1;
    z.el.style.opacity = Math.min(ein, aus);
    z.el.style.transform = `translateY(${(1 - ein) * 80}px) scale(${1 + lt * .012})`;
    z.ws.forEach((w, j) => {
      const p = ersteSzene ? 1 : E.back(prog(lt, .08 + j * .07, .38 + j * .07));
      w.style.opacity = clamp(p * 1.5);
      w.style.transform = `translateY(${(1 - p) * 60}px)`;
    });
    const wortEnde = .38 + z.ws.length * .07;
    if (z.s.typ === 'hook') {
      const st = z.el.querySelector('.stempel'), rz = z.el.querySelector('.rezept');
      const bei = z.s.stempelBei ?? .55;
      const p = prog(lt, bei, bei + .22);
      st.style.opacity = p > 0 ? 1 : 0;
      st.style.transform = `rotate(-12deg) scale(${2.4 - 1.4 * E.out(p)})`;
      const schlag = prog(lt, bei + .18, bei + .5);
      const wackel = schlag > 0 && schlag < 1 ? Math.sin(schlag * 30) * (1 - schlag) * 14 : 0;
      rz.style.transform = `rotate(-3deg) translateX(${wackel}px)`;
    }
    if (z.s.typ === 'zaehler') {
      const p = E.in(prog(lt, .3, z.s.dauer - .7));
      const n = Math.round(z.s.von + (z.s.bis - z.s.von) * p);
      const nel = z.el.querySelector('.n');
      nel.textContent = n;
      const drueber = z.s.grenze != null && n > z.s.grenze;
      nel.style.color = drueber ? 'var(--rose)' : '';
      const puls = drueber ? 1 + .08 * Math.max(0, 1 - prog(lt, z.s.dauer - .7, z.s.dauer - .3)) : 1;
      nel.style.display = 'inline-block'; nel.style.transform = `scale(${puls})`;
    }
    if (z.s.typ === 'frage') {
      const bei = z.s.antwortBei ?? Math.max(wortEnde + .6, z.s.dauer * .5);
      const p = E.back(prog(lt, bei, bei + .35));
      const k = z.el.querySelector('.karte');
      k.style.opacity = clamp(p * 1.5); k.style.transform = `translateY(${(1 - p) * 70}px)`;
    }
    if (z.s.typ === 'vergleich') {
      const [l, r] = z.el.querySelectorAll('.karte');
      const pl = E.out(prog(lt, wortEnde, wortEnde + .3));
      const bei = z.s.rechtsBei ?? Math.max(wortEnde + .8, z.s.dauer * .45);
      const pr = E.back(prog(lt, bei, bei + .35));
      l.style.opacity = pl; l.style.transform = `translateY(${(1 - pl) * 50}px)`;
      r.style.opacity = clamp(pr * 1.5); r.style.transform = `translateY(${(1 - pr) * 70}px)`;
    }
    if (z.s.typ === 'countdown') {
      const ps = z.el.querySelectorAll('.punkt'), d = z.s.dauer / ps.length;
      ps.forEach((p, j) => {
        const pp = prog(lt, j * d, j * d + .25);
        const an = lt >= j * d && (lt < (j + 1) * d || j === ps.length - 1);
        p.style.opacity = an ? E.out(pp) : 0;
        p.querySelector('.nr').style.transform = `scale(${1.5 - .5 * E.out(pp)})`;
        p.querySelector('.nr').style.transformOrigin = 'left bottom';
      });
    }
    if (z.s.typ === 'enthuellung') {
      const p = E.out(prog(lt, .2, z.s.dauer * .65));
      const t2 = z.el.querySelector('.enth');
      t2.style.filter = `blur(${(1 - p) * 28}px)`; t2.style.opacity = .35 + .65 * p;
    }
    if (z.s.typ === 'figur') figurRender(z, lt, ersteSzene);
    if (z.s.typ === 'geraet') geraetRender(z, lt);
    if (z.s.typ === 'tippen') {
      const tempo = z.s.tempo ?? 22; // Zeichen pro Sekunde
      // Szene 1: ein Drittel steht ab Frame 0 (Vorschaubild darf nicht leer sein)
      const vorlauf = ersteSzene ? Math.ceil(z.tippText.length * .35) : 0;
      const n = vorlauf + Math.floor(Math.max(0, lt - .15) * tempo);
      z.el.querySelector('.tipp').textContent = z.tippText.slice(0, n);
      z.el.querySelector('.cursor').style.opacity = n >= z.tippText.length ? (Math.floor(lt * 2.5) % 2 ? 0 : 1) : 1;
    }
  });
};
renderAt(0);
</script>
</body>
</html>
