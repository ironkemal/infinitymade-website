<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Praxura Ops</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗂️</text></svg>">
<link rel="stylesheet" href="app.css?v=20260816d">
</head>
<body>

<!-- ── Start ──────────────────────────────────────────────────────────────
     Sichtbar, bis der Start entschieden ist (App oder Login). Ohne diesen
     Zwischenschritt wäre die Seite bei jedem hängenden Start einfach leer. -->
<div id="boot" class="login">
  <div class="login-card" style="text-align:center">
    <div class="login-mark">Prax<em>ura</em></div>
    <p class="login-sub" id="bootMsg">Laden …</p>
    <button class="btn btn-ghost" id="bootReload" hidden>Neu laden</button>
  </div>
</div>

<!-- ── Login ──────────────────────────────────────────────────────────── -->
<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="login-mark">Prax<em>ura</em></div>
    <p class="login-sub">Ops-Dashboard — intern</p>
    <label class="fld">
      <span>E-Mail</span>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label class="fld">
      <span>Passwort</span>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit" id="loginBtn">Anmelden</button>
    <p class="login-err" id="loginErr" hidden></p>
  </form>
</div>

<!-- ── App ────────────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>

  <header class="top">
    <div class="brand">Prax<em>ura</em> <span class="brand-tag">Ops</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-view="todo">Aufgaben</button>
      <button class="tab" data-view="wissen">Wissensbank</button>
      <button class="tab" data-view="decisions">Entscheidungen</button>
      <button class="tab" data-view="meetings">Meetings</button>
      <button class="tab" data-view="ausgaben">Ausgaben</button>
      <button class="tab" data-view="fahrtenbuch">Fahrtenbuch</button>
      <button class="tab" data-view="files">Dateien</button>
    </nav>
    <div class="top-right">
      <span class="who" id="who"></span>
      <button class="btn btn-ghost" id="logoutBtn" title="Abmelden">Abmelden</button>
    </div>
  </header>

  <main class="main">

    <!-- ── Aufgaben ─────────────────────────────────────────────────── -->
    <section class="view" id="view-todo">
      <div class="view-bar">
        <button class="btn btn-primary" id="addTodoBtn">+ Aufgabe</button>
        <div class="spacer"></div>
        <label class="chk-inline">
          <input type="checkbox" id="showArchived">
          <span>Archiv zeigen</span>
        </label>
        <span class="hint" id="boardHint"></span>
      </div>
      <div class="tagbar" id="catBar"></div>
      <div class="board" id="board"><!-- kolonlar JS ile --></div>
    </section>

    <!-- ── Wissensbank ──────────────────────────────────────────────── -->
    <section class="view" id="view-wissen" hidden>
      <div class="view-bar">
        <button class="btn btn-primary" id="addWissenBtn">+ Eintrag</button>
        <input class="search" id="wissenSearch" type="search" placeholder="Suchen … (Titel, Inhalt, #tag)">
        <div class="spacer"></div>
        <span class="hint" id="wissenCount"></span>
      </div>
      <div class="tagbar" id="wissenTags"></div>
      <div class="cards" id="wissenList"></div>
    </section>

    <!-- ── Entscheidungen ───────────────────────────────────────────── -->
    <section class="view" id="view-decisions" hidden>
      <div class="view-bar">
        <button class="btn btn-primary" id="addDecisionBtn">+ Entscheidung</button>
        <input class="search" id="decisionSearch" type="search" placeholder="Suchen …">
        <div class="spacer"></div>
        <span class="hint">Warum haben wir das so gemacht</span>
      </div>
      <div class="timeline" id="decisionList"></div>
    </section>

    <!-- ── Meetings ─────────────────────────────────────────────────── -->
    <section class="view" id="view-meetings" hidden>
      <div class="view-bar">
        <button class="btn btn-primary" id="addMeetingBtn">+ Meeting</button>
        <div class="spacer"></div>
        <span class="hint">Notiz einfügen → Claude macht Aufgaben daraus</span>
      </div>
      <div class="cards" id="meetingList"></div>
    </section>

    <!-- ── Ausgaben (Finanzen & EÜR) ──────────────────────────────────── -->
    <section class="view" id="view-ausgaben" hidden>
      <div class="view-bar">
        <button class="btn btn-primary" id="addExpenseBtn">+ Ausgabe</button>
        <select class="search f-filter-select" id="fYearFilter" style="max-width:130px">
          <option value="all">Alle Jahre</option>
        </select>
        <select class="search f-filter-select" id="fCatFilter" style="max-width:210px">
          <option value="all">Alle Steuerkategorien</option>
          <option value="software_cloud">☁️ Software & Cloud</option>
          <option value="telecom_internet">📱 Telekom & Internet</option>
          <option value="office_supplies">📎 Büromaterial</option>
          <option value="gwg_assets">💻 GWG (≤ 800 €)</option>
          <option value="digital_assets_afa">🖥️ Digital (Sofort-AfA)</option>
          <option value="travel_mobility">🚆 Reise- & Fahrtkosten</option>
          <option value="education_training">📚 Fortbildung</option>
          <option value="marketing_sales">📣 Marketing & Ads</option>
          <option value="bank_fees">💳 Bankgebühren</option>
          <option value="rent_lease">🏢 Miete & Raumkosten</option>
          <option value="insurance">🛡️ Versicherungen</option>
          <option value="professional_services">🤝 Fremdleistungen</option>
          <option value="legal_tax_advisory">⚖️ Rechts- & Steuerberatung</option>
          <option value="repairs_maintenance">🔧 Reparaturen</option>
          <option value="business_meals">🍽️ Bewirtung</option>
          <option value="post_shipping">📦 Porto & Versand</option>
          <option value="other_operational">🏷️ Sonstige Betriebsausgaben</option>
          <option value="private_expense">🚫 Privat (Nicht in EÜR)</option>
        </select>
        <select class="search f-filter-select" id="fPaidByFilter" style="max-width:170px">
          <option value="all">Alle Zahlungskonten</option>
          <option value="euer_only">Nur EÜR-Ausgaben (Kemal)</option>
          <option value="kemal_business">Geschäftskonto Kemal</option>
          <option value="melih_private">Melih privat (Nicht in EÜR)</option>
        </select>
        <select class="search f-filter-select" id="fVatFilter" style="max-width:160px">
          <option value="all">Alle USt-Arten</option>
          <option value="standard">Nur Inland (§15 Vorsteuer)</option>
          <option value="reverse_charge">Nur § 13b Reverse Charge</option>
        </select>
        <select class="search f-filter-select" id="fStatusFilter" style="max-width:130px">
          <option value="all">Alle Status</option>
          <option value="processed">Verarbeitet</option>
          <option value="review_needed">Prüfung nötig</option>
          <option value="archived">Archiviert</option>
        </select>
        <label class="chk-inline">
          <input type="checkbox" id="fOnlyRecurring">
          <span>Nur Abos</span>
        </label>
        <input class="search" id="financeSearch" type="search" placeholder="Suchen … (Lieferant, Land, USt-ID, Text)">
        <div class="spacer"></div>
        <button class="btn btn-ghost" id="exportCsvBtn" title="Anlage EÜR CSV für Elster exportieren">📊 EÜR CSV</button>
        <button class="btn btn-ghost" id="exportJsonBtn" title="Anlage EÜR JSON exportieren">JSON</button>
        <a class="btn btn-ghost" id="financeDriveLink" target="_blank" rel="noopener" hidden>Belegordner ↗</a>
      </div>

      <!-- KPI Summary Cards -->
      <div class="f-kpi-grid" id="financeKPIs"></div>

      <!-- Vendor Portfolio & Spend Breakdown (Firma Firma Label & Filter) -->
      <div id="financeVendorPortfolio"></div>

      <!-- EÜR Tax Category Breakdown -->
      <div id="financeBreakdown"></div>

      <!-- Expense Invoices Table & Summary -->
      <div class="f-list-head">
        <h3 style="margin:0;font-size:15px">Belege & Betriebsausgaben</h3>
        <span class="hint" id="financeCount"></span>
      </div>
      <div id="financeList"></div>
    </section>

    <!-- ── Dateien ──────────────────────────────────────────────────── -->
    <section class="view" id="view-files" hidden>
      <div class="view-bar">
        <div class="crumbs" id="fileCrumbs"></div>
        <div class="spacer"></div>
        <a class="btn btn-ghost" id="driveLink" target="_blank" rel="noopener" hidden>Geteilter Ordner ↗</a>
      </div>
      <div class="files-split">
        <div class="filetree" id="fileTree"></div>
        <div class="fileview" id="fileView">
          <p class="empty">Links eine Datei wählen.</p>
        </div>
      </div>
    </section>

    <!-- ── Fahrtenbuch ─────────────────────────────────────────────── -->
    <section id="view-fahrtenbuch" class="view" hidden></section>

  </main>
</div>

<!-- ── Modal (tüm formlar burada render edilir) ────────────────────────── -->
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-top">
      <h2 id="modalTitle"></h2>
      <button class="btn btn-icon" id="modalClose" aria-label="Schließen">×</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js?v=20260816i"></script>
</body>
</html>
