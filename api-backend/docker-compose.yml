services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.47
    restart: unless-stopped
    command:
      - --api=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}/
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=true
    volumes:
      - ./n8n_data:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=le 
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    networks:
      - web

  calendar-api:
    image: ghcr.io/ironkemal/infinitymade-website/calendar-api:latest
    container_name: calendar-api
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ./.env.calendar
    labels:
      - traefik.enable=true
      # Alles unter /api gehört uns — AUSSER /api/v1, das ist n8n's Public REST API.
      # Vorher stand hier eine Positivliste einzelner Pfade. Die ist zweimal
      # stillschweigend veraltet (2026-08-11: /api/attendance, /api/admin und
      # /api/arzt fehlten → Traefik schickte sie an n8n, das mit 200 HTML bzw.
      # 404 antwortete und im Browser wie ein CORS-Fehler aussah).
      # Eine neue Route in server.js darf nicht davon abhängen, dass jemand
      # daran denkt, hier nachzuziehen.
      #
      # ⚠️ DIESE DATEI IST NUR DIE REPO-KOPIE. Watchtower erneuert das IMAGE,
      # niemals die Compose-Datei oder diese Labels. Der Fix von 2026-08-11 stand
      # vier Tage hier drin und war auf dem VPS nie aktiv — deshalb lief am
      # 2026-08-15 der Kiosk-Modus ins Leere (/api/kiosk fehlte in der alten
      # Positivliste) und /api/attendance war weiterhin tot. Wer diese Regel
      # ändert, muss sie in /opt/calendar-api/docker-compose.yml nachziehen und
      # `docker compose up -d calendar-api` laufen lassen.
      # Auf dem VPS angewandt: 2026-08-15. Details: INFRASTRUCTURE.md §4.
      - "traefik.http.routers.api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`) && !PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - web

  # Umami — DSGVO-friendly self-hosted analytics. Cookie-free, no consent needed.
  # Subdomain: analytics.infinitymade.de (DNS A-record → VPS IP gerekli)
  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - ./umami_db:/var/lib/postgresql/data
    networks:
      - web

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    depends_on:
      - umami-db
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET}
      - DISABLE_TELEMETRY=1
    labels:
      - traefik.enable=true
      - "traefik.http.routers.umami.rule=Host(`analytics.infinitymade.de`)"
      - traefik.http.routers.umami.entrypoints=websecure
      - traefik.http.routers.umami.tls=true
      - traefik.http.routers.umami.tls.certresolver=le
      - traefik.http.services.umami.loadbalancer.server.port=3000
    networks:
      - web

  # Auto-redeploy: polls GHCR every 60s, pulls new image, restarts container.
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --interval=60
      - --cleanup
      - --label-enable
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - web

# Tag containers we want auto-updated; n8n stays manual.

networks:
  web:
    name: web
